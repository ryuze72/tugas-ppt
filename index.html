<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tugas Sekolah — Olahraga</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#2f2f2f;--bg2:#3a3a3a;
  --yellow:#f4e04d;--lime:#c5e384;--green:#2f7d3a;
  --purple:#7b7fd6;--orange:#e8903a;--blue:#a9c8ee;
  --cream:#f5f0e1;--ink:#1a1a1a;--white:#fff;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --spring:cubic-bezier(.34,1.3,.64,1);
  --expo:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;overflow:hidden;background:#1a1a1a;font-family:'Quicksand',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stage{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}

/* stars */
.stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}

/* slides */
.slide{
  position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  z-index:1;display:flex;align-items:center;justify-content:center;padding:1.4rem 1.2rem 4.2rem;
  contain:layout paint;
}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:5}

.blob{position:relative}
.blob-y{background:var(--yellow)}
.blob-g{background:var(--lime)}
.blob-p{background:var(--purple)}
.blob-c{background:var(--cream)}
.blob-o{background:var(--orange)}
.blob-b{background:var(--blue)}

.h1{font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.1;color:var(--ink)}
.h2{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.15;color:var(--ink)}
.body{font-family:'Quicksand',sans-serif;color:#2a2a2a;line-height:1.5}

.deco{position:absolute;pointer-events:none;z-index:2}
.sun{
  width:68px;height:68px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 8px rgba(244,224,77,.22);animation:spin 22s linear infinite;
}
.sun::before,.sun::after{content:'';position:absolute;background:var(--yellow)}
.sun::before{width:11px;height:86px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px}
.sun::after{width:86px;height:11px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.cloud{width:68px;height:26px;background:#fff;border-radius:40px;position:relative;opacity:.9}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;top:-16px;left:10px}
.cloud::after{width:26px;height:26px;top:-10px;right:12px}

/* nav */
.nav{
  position:absolute;bottom:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1rem;background:rgba(18,18,18,.94);border-top:2px solid #4a4a4a;gap:.5rem;
}
.btn{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;
  padding:.5rem 1.1rem;border:none;border-radius:999px;cursor:pointer;
  transition:transform .35s var(--spring),background .3s ease,box-shadow .3s ease,opacity .3s ease;
}
@media(hover:hover){.btn:hover:not(:disabled){transform:translateY(-2px)}}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-prev{background:#4a4a4a;color:#fff}
.btn-next{background:var(--yellow);color:#1a1a1a;box-shadow:0 3px 12px rgba(244,224,77,.35)}
.dots{display:flex;gap:6px;align-items:center;justify-content:center;max-width:180px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#555;border:none;cursor:pointer;transition:width .5s var(--spring),background .4s ease,transform .3s ease}
@media(hover:hover){.dot:hover{transform:scale(1.35)}}
.dot.on{background:var(--yellow);width:20px;border-radius:6px}
.counter{
  position:absolute;top:.65rem;right:1rem;z-index:40;
  font-family:'Fredoka',sans-serif;font-size:.72rem;color:#ccc;
  background:rgba(0,0,0,.45);padding:.28rem .65rem;border-radius:999px;
}
.toc-btn{
  position:absolute;top:.65rem;left:1rem;z-index:40;
  font-family:'Fredoka',sans-serif;font-size:.72rem;
  background:var(--purple);color:#fff;border:none;padding:.32rem .8rem;
  border-radius:999px;cursor:pointer;transition:transform .35s var(--spring),filter .3s ease;
}
@media(hover:hover){.toc-btn:hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.1)}}

/* member */
.member{
  background:#3f3f3f;border-radius:18px;padding:.9rem .8rem;text-align:center;
  border:2px solid #555;width:155px;
}
.avatar{
  width:68px;height:68px;border-radius:50%;margin:0 auto .55rem;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;color:#fff;border:3px solid #fff;overflow:hidden;
  background-size:cover;background-position:center;
}
.member .name{font-family:'Fredoka',sans-serif;font-size:.92rem;color:var(--yellow);margin-bottom:.12rem}
.member .role{font-size:.72rem;color:#bbb}

.toc-num{
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;
  background:#6b4a2a;color:#fff;transition:transform .4s var(--spring),background .3s ease,box-shadow .3s ease;
  box-shadow:0 3px 0 #4a3018;
}
@media(hover:hover){.toc-num:hover{transform:translateY(-3px) scale(1.06);background:#8a5a30;box-shadow:0 6px 0 #4a3018}}
.toc-num:active{transform:translateY(1px) scale(.96);box-shadow:0 1px 0 #4a3018}

.wrap{position:relative;z-index:3;width:100%;max-width:1080px;margin:0 auto}

@media(max-width:700px){
  .member{width:115px;padding:.65rem}
  .avatar{width:52px;height:52px;font-size:1.25rem}
  .toc-num{width:40px;height:40px;font-size:.8rem}
  .h1{font-size:1.55rem!important}
  .h2{font-size:1.2rem!important}
}

/* =========================================================
   ANIMASI & TRANSISI (v4 — lebih halus, tidak kaku)
   ========================================================= */
.deco.cloud{position:absolute}
.deco{will-change:translate}
.stars{will-change:translate}

.wipe{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden}

.progress{position:absolute;top:0;left:0;height:5px;z-index:60;width:100%;transform-origin:0 50%;transform:scaleX(calc(var(--p,10)/100));background:linear-gradient(90deg,var(--yellow),var(--lime),var(--purple));transition:transform 1.1s var(--ease-out)}
.confetti{position:absolute;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#cur{display:inline-block}

/* muncul bertahap: easing lembut (tanpa tersentak) */
.pop{opacity:0;transform:var(--from,scale(.92));
  transition:opacity .9s ease,transform 1.4s var(--expo)}
.slide.active .pop{opacity:1;transform:none;transition-delay:calc(.08s + var(--n,0)*.075s)}
.p7{--n:6}.p1{--n:0}.p2{--n:1}.p3{--n:2}.p4{--n:3}.p5{--n:4}.p6{--n:5}
.slide.active.settled .pop{transition-delay:0s}
@media(hover:hover){
.slide.active .pop[style*="border-radius"]:hover,.slide.active .member:hover{
  transform:translateY(-5px) scale(1.03) rotate(-.8deg);transition:transform .5s var(--expo),opacity .7s ease;transition-delay:0s}
}

@keyframes morph{
  0%,100%{border-radius:30% 70% 60% 40%/50% 40% 60% 50%}
  33%{border-radius:55% 45% 40% 60%/40% 60% 45% 55%}
  66%{border-radius:42% 58% 62% 38%/58% 42% 52% 48%}
}
.blob{animation:breathe 7s ease-in-out infinite;animation-delay:var(--md,0s)}
@keyframes breathe{0%,100%{rotate:-.6deg;scale:1}50%{rotate:.6deg;scale:1.025}}

.letter{display:inline-block;opacity:0}
.slide.active .letter{animation:letterIn 1.2s var(--expo) both;animation-delay:calc(.1s + var(--i)*.05s)}
@keyframes letterIn{
  0%{opacity:0;transform:translateY(34px) rotate(6deg) scale(.75)}
  100%{opacity:1;transform:none}
}

.toc-item{opacity:0}
.slide.active .toc-item{animation:tocIn 1.1s var(--expo) both;animation-delay:calc(.15s + var(--i)*.06s)}
@keyframes tocIn{from{opacity:0;transform:scale(.5) translateY(12px) rotate(-8deg)}to{opacity:1;transform:none}}

.ic{display:block;transform-origin:50% 100%}
.ic-bola{animation:bounce 2.2s ease-in-out infinite}
.ic-basket{animation:bounce 2.2s ease-in-out infinite .35s}
.ic-piala{animation:wiggle 3.4s ease-in-out infinite;transform-origin:50% 90%}
.ic-sepatu{animation:tilt 2.6s ease-in-out infinite}
.ic-pelari{animation:run 1.3s ease-in-out infinite}
.ic-bumi{animation:spin 40s linear infinite;transform-origin:50% 50%}
@keyframes bounce{
  0%{transform:translateY(0) scale(1.08,.9) rotate(0);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  14%{transform:translateY(0) scale(1) rotate(30deg);animation-timing-function:cubic-bezier(.3,.6,.4,1)}
  50%{transform:translateY(-24px) scale(1) rotate(200deg);animation-timing-function:cubic-bezier(.6,0,.8,.5)}
  88%{transform:translateY(0) scale(1) rotate(330deg)}
  100%{transform:translateY(0) scale(1.08,.9) rotate(360deg)}
}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-4px)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

.sun{animation:spin 22s linear infinite}
.cloud{animation:drift 16s ease-in-out -7s infinite alternate}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
.shoot{position:absolute;top:8%;left:-12%;width:100px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 9s linear infinite 2.5s;z-index:0}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) rotate(25deg)}
  2%{opacity:1}
  9%{opacity:0;transform:translate(125vw,58vh) rotate(25deg)}
  100%{opacity:0;transform:translate(125vw,58vh) rotate(25deg)}
}

.btn:active:not(:disabled){transform:scale(.94)}
.btn-next{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}88%{transform:translateX(4px)}94%{transform:translateX(0)}}
.btn-next:hover{animation:none}

.btn{white-space:nowrap}
@media(max-width:700px){
  .nav{padding:.55rem .7rem;gap:.4rem}
  .btn{font-size:.8rem;padding:.5rem .85rem}
  .dots{max-width:none;flex-wrap:nowrap;gap:4px;flex:1}
  .dot{width:7px;height:7px}.dot.on{width:15px}
  .counter,.toc-btn{top:.8rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

.heart-bg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:118%;max-width:560px;height:auto;z-index:0;pointer-events:none;animation:heartbeat 1.3s ease-in-out infinite}
@keyframes heartbeat{0%,100%{scale:1}15%{scale:1.05}30%{scale:1}45%{scale:1.04}}
.ic-bolaK{transform-origin:50% 50%;animation:spin 5s linear infinite}
.card-ic{display:block;width:44px;height:44px;flex:0 0 auto}
.card-ic.big{width:64px;height:64px}
.card-ic svg{width:100%;height:100%}
.ic-lari{animation:run 1.3s ease-in-out infinite}
.ic-beladiri{animation:wiggle 1.8s ease-in-out infinite}
.ic-renang{animation:tilt 2.6s ease-in-out infinite}
.ic-senam{animation:wiggle 3.4s ease-in-out infinite}
.ic-hati,.ic-bolt,.ic-teknik,.ic-stop{transform-origin:50% 50%;animation:pulse 1.4s ease-in-out infinite}
.ic-dumbbell{animation:lift 1.6s ease-in-out infinite}
.ic-smile{animation:tilt 2.8s ease-in-out infinite}
.ic-medal{transform-origin:50% 0;animation:wiggle 2.8s ease-in-out infinite}
.ic-plester,.ic-botol,.ic-sepatu2{animation:tilt 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes lift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.arrow{display:inline-block;animation:arrowgo 1.4s ease-in-out infinite}
@keyframes arrowgo{0%,100%{translate:0 0}50%{translate:6px 0}}

.jj-ball{animation:jjBall 1.1s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes jjBall{from{transform:translateY(0)}to{transform:translateY(-34px)}}

.heart-p{transform-origin:214px 44px;animation:pulse .9s ease-in-out infinite}
.speed{animation:speed .5s linear infinite}
.track-line{animation:track .5s linear infinite}
@keyframes speed{from{transform:translateX(20px);opacity:0}30%{opacity:.6}to{transform:translateX(-24px);opacity:0}}
@keyframes track{to{stroke-dashoffset:-28}}

.slide:not(.active) *{animation-play-state:paused!important}

/* ===== konsep video: planet, bulan, mind map ===== */
.deco.planet,.deco.moon{opacity:1}
.deco.planet svg,.deco.moon svg{width:100%;height:auto}
.ic-planet{transform-origin:50% 50%;animation:spin 60s linear infinite}

.mm{position:relative;width:min(100%,940px,calc((100vh - 8rem)*1.6));aspect-ratio:16/10;container-type:inline-size;margin:0 auto}
@supports (height:100dvh){.mm{width:min(100%,940px,calc((100dvh - 8rem)*1.6))}}
.mm-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.mm-line{fill:none;stroke:#d6d6d6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .mm-line{animation:draw 1.2s var(--ease-io) .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mm-n{position:absolute;z-index:1;left:calc(var(--x)*1%);top:calc(var(--y)*1%);translate:-50% -50%;
  width:max-content;max-width:var(--w,30cqw);padding:.55em .95em;border-radius:1.1em 1.5em 1.2em 1.4em;
  font-family:'Fredoka',sans-serif;font-size:clamp(.62rem,1.9cqw,1.02rem);line-height:1.15;color:#1a1a1a;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:.55em}
.mm-n.leaf{width:var(--w);justify-content:flex-start;text-align:left}
.mm-n.scene{width:var(--w);padding:0;background:none;border-radius:0}
.mm-n.scene svg{width:100%;max-width:none;height:auto}
.mm-root{font-size:clamp(.95rem,3.4cqw,1.8rem);background:var(--yellow);padding:.8em 1em;line-height:1.1}
@media(max-width:700px){
  .mm{aspect-ratio:3/5;width:min(100%,calc((100vh - 8rem)*.6))}
  @supports (height:100dvh){.mm{width:min(100%,calc((100dvh - 8rem)*.6))}}
  .mm-n{left:calc(var(--mx)*1%);top:calc(var(--my)*1%);max-width:var(--mw,44cqw);font-size:clamp(.66rem,3.3cqw,.92rem)}
  .mm-n.leaf,.mm-n.scene{width:var(--mw)}
  .mm-root{font-size:clamp(.95rem,5.2cqw,1.4rem)}
  .nolm .mm-lines{display:none}
}

/* ===== MORPH ENGINE ala PowerPoint (FLIP + ghost crossfade) ===== */
#morph-layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
#morph-layer>*{position:absolute;margin:0!important;max-width:none!important;translate:none!important;rotate:none!important;scale:none!important;animation:none!important;box-sizing:border-box;transform-origin:50% 50%;will-change:transform,opacity}
.slide.leaving{visibility:visible;opacity:1;z-index:3;pointer-events:none}
.slide.leaving .pop{opacity:1!important;transform:none!important;transition:none!important}
.slide.leaving .letter,.slide.leaving .toc-item{opacity:1!important;animation:none!important}
.slide.leaving .mm-line{stroke-dashoffset:0!important;animation:none!important}
.slide.measure .pop{transform:none!important;transition:none!important}
.morphing .slide.active{animation:none!important}
/* elemen baru muncul lebih cepat (sebelumnya menunggu ~0.9s) */
.morphing .slide.active .pop:not(.mx){transform:none!important;transition:opacity .8s ease .4s!important}
.morphing .slide.active .mx{transition:none!important}
.morphing .slide.active .letter{animation-delay:calc(.45s + var(--i)*.045s)}
.morphing .slide.active .toc-item{animation-delay:calc(.45s + var(--i)*.06s)}
.morphing .slide.active .mm-line{animation-delay:.6s}
.morphing .star,.morphing .shoot{animation-play-state:paused}
/* selama transisi, jeda animasi yang berat (karakter SVG & napas blob) supaya main-thread bebas untuk morph.
   Dilanjutkan otomatis dari titik yang sama setelah transisi selesai → tidak ada loncatan. */
.morphing .blob{animation-play-state:paused}
.morphing .slide.active svg:not(.mm-lines),.morphing .slide.active svg:not(.mm-lines) *{animation-play-state:paused!important}
.deco{transition:none}
.stars{transition:none}

/* ===== animasi karakter v2 ===== */
.jk-body{animation:jkBody 1.1s infinite}
@keyframes jkBody{
 0%,100%{transform:translateY(5px) scale(1.05,.93);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
 16%{transform:translateY(-1px) scale(.97,1.04);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
 44%{transform:translateY(-18px) scale(1,1);animation-timing-function:ease-in-out}
 54%{transform:translateY(-18px) scale(1,1);animation-timing-function:cubic-bezier(.6,0,.9,.5)}
 82%{transform:translateY(0) scale(1.03,.96);animation-timing-function:ease-out}
}
.jk-aR,.jk-fR,.jk-tR,.jk-sR{--s:-1}
.jk-aL,.jk-aR{animation:jkUA 1.1s ease-in-out infinite}
.jk-fL,.jk-fR{animation:jkFA 1.1s ease-in-out infinite;animation-delay:-1.04s}
.jk-tL,.jk-tR{animation:jkTh 1.1s ease-in-out infinite}
.jk-sL,.jk-sR{animation:jkShin 1.1s ease-in-out infinite}
.jk-head{animation:jkHead 1.1s ease-in-out infinite;animation-delay:-1.02s}
.jk-shadow{animation:jkShadow 1.1s ease-in-out infinite}
@keyframes jkUA{0%{transform:rotate(calc(var(--s,1)*6deg))}10%{transform:rotate(calc(var(--s,1)*-3deg))}44%{transform:rotate(calc(var(--s,1)*176deg))}54%{transform:rotate(calc(var(--s,1)*166deg))}82%{transform:rotate(calc(var(--s,1)*40deg))}94%{transform:rotate(calc(var(--s,1)*0deg))}100%{transform:rotate(calc(var(--s,1)*6deg))}}
@keyframes jkFA{0%{transform:rotate(calc(var(--s,1)*-10deg))}10%{transform:rotate(calc(var(--s,1)*8deg))}44%{transform:rotate(calc(var(--s,1)*10deg))}54%{transform:rotate(calc(var(--s,1)*-8deg))}82%{transform:rotate(calc(var(--s,1)*-18deg))}94%{transform:rotate(calc(var(--s,1)*5deg))}100%{transform:rotate(calc(var(--s,1)*-10deg))}}
@keyframes jkTh{0%,16%{transform:rotate(0deg)}44%,54%{transform:rotate(calc(var(--s,1)*17deg))}82%{transform:rotate(calc(var(--s,1)*5deg))}100%{transform:rotate(0deg)}}
@keyframes jkShin{0%,100%{transform:rotate(calc(var(--s,1)*-14deg))}16%{transform:rotate(calc(var(--s,1)*-2deg))}44%,54%{transform:rotate(calc(var(--s,1)*-4deg))}82%{transform:rotate(calc(var(--s,1)*-10deg))}}
@keyframes jkHead{0%{transform:rotate(3deg)}44%{transform:rotate(-5deg)}54%{transform:rotate(-3deg)}82%{transform:rotate(4deg)}100%{transform:rotate(3deg)}}
@keyframes jkShadow{0%,100%{transform:scale(1.05,1);opacity:.3}44%,54%{transform:scale(.72,1);opacity:.14}}

.rn2-body{animation:rn2Bob .36s infinite}
@keyframes rn2Bob{0%,100%{transform:translateY(1px);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(-7px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
.rn2-th{animation:rn2Th .72s ease-in-out infinite}
.rn2-sh{animation:rn2Shin .72s ease-in-out infinite}
.rn2-ua{animation:rn2Ua .72s ease-in-out infinite}
.rn2-fa{animation:rn2Fa .72s ease-in-out infinite;animation-delay:-.68s}
.rn2-th.f,.rn2-sh.f,.rn2-ua.f{animation-delay:-.36s}
.rn2-fa.f{animation-delay:-.32s}
@keyframes rn2Th{0%{transform:rotate(-40deg)}12%{transform:rotate(-24deg)}40%{transform:rotate(26deg)}55%{transform:rotate(22deg)}75%{transform:rotate(-6deg)}90%{transform:rotate(-34deg)}100%{transform:rotate(-40deg)}}
@keyframes rn2Shin{0%{transform:rotate(24deg)}12%{transform:rotate(6deg)}40%{transform:rotate(8deg)}55%{transform:rotate(70deg)}75%{transform:rotate(104deg)}90%{transform:rotate(52deg)}100%{transform:rotate(24deg)}}
@keyframes rn2Ua{0%,100%{transform:rotate(42deg)}50%{transform:rotate(-52deg)}}
@keyframes rn2Fa{0%,100%{transform:rotate(-68deg)}50%{transform:rotate(-104deg)}}
.rn2-head{animation:rn2Head .36s ease-in-out infinite alternate}

/* =========================================================
   NAVIGASI
   ========================================================= */
let slides = [];
let i = 0;
const total = 11;

function renderDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  for (let n = 0; n < total; n++) {
    const b = document.createElement('button');
    b.className = 'dot' + (n === i ? ' on' : '');
    b.onclick = () => go(n);
    el.appendChild(b);
  }
}

/* polyline → path dengan sudut membulat; titik ganda/sejajar dibuang */
function roundPath(pts, r) {
  const P = [pts[0]];
  for (let k = 1; k < pts.length; k++) {
    const p = P[P.length - 1], q = pts[k];
    if (Math.hypot(q[0] - p[0], q[1] - p[1]) > .5) P.push(q);
  }
  const Q = [P[0]];
  for (let k = 1; k < P.length - 1; k++) {
    const a = Q[Q.length - 1], b = P[k], c = P[k + 1];
    if (Math.abs((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) > .01) Q.push(b);
  }
  Q.push(P[P.length - 1]);
  const f = n => n.toFixed(2);
  let d = `M${f(Q[0][0])} ${f(Q[0][1])}`;
  for (let k = 1; k < Q.length - 1; k++) {
    const a = Q[k - 1], b = Q[k], c = Q[k + 1];
    const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]), l2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    const t = Math.min(r, l1 / 2, l2 / 2);
    const p1 = [b[0] + (a[0] - b[0]) / l1 * t, b[1] + (a[1] - b[1]) / l1 * t];
    const p2 = [b[0] + (c[0] - b[0]) / l2 * t, b[1] + (c[1] - b[1]) / l2 * t];
    d += ` L${f(p1[0])} ${f(p1[1])} Q${f(b[0])} ${f(b[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  const e = Q[Q.length - 1];
  return d + ` L${f(e[0])} ${f(e[1])}`;
}

function layoutMM(mm) {
  const svg = mm.querySelector('.mm-lines'); if (!svg) return;
  const W = mm.offsetWidth, H = mm.offsetHeight; if (!W) return;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const nodes = {}; mm.querySelectorAll('.mm-n[data-id]').forEach(n => nodes[n.dataset.id] = n);
  let out = '';
  /* mode pohon (HP): garis siku-siku bersudut membulat, tanpa persilangan */
  const tree = mm.dataset.tree && matchMedia('(max-width:700px)').matches;
  let ym = 0;
  if (tree && nodes.r) {
    const tops = [...mm.querySelectorAll('.mm-n[data-parent="r"]')].map(n => n.offsetTop - n.offsetHeight / 2);
    ym = (nodes.r.offsetTop + nodes.r.offsetHeight / 2 + Math.min(...tops)) / 2;
  }
  mm.querySelectorAll('.mm-n[data-parent]').forEach(c => {
    const a = nodes[c.dataset.parent]; if (!a) return;
    const ax = a.offsetLeft, ay = a.offsetTop, aw = a.offsetWidth, ah = a.offsetHeight;
    const bx = c.offsetLeft, by = c.offsetTop, bw = c.offsetWidth, bh = c.offsetHeight;
    if (tree) {
      const t1 = W * mm.dataset.t1 / 100, t2 = W * mm.dataset.t2 / 100;
      const pts = c.dataset.parent === 'r'
        ? [[ax, ay + ah / 2], [ax, ym], [t1, ym], [t1, by], [bx - bw / 2, by]]
        : [[ax + aw / 2, ay], [t2, ay], [t2, by], [bx - bw / 2, by]];
      out += `<path class="mm-line" pathLength="1" d="${roundPath(pts, 10)}"/>`;
      return;
    }
    const dx = bx - ax, dy = by - ay; let d;
    if (Math.abs(dy) > Math.abs(dx) * 0.8) {
      const sg = Math.sign(dy) || 1, y1 = ay + sg * ah / 2, y2 = by - sg * bh / 2, m = (y1 + y2) / 2;
      d = `M${ax} ${y1} C${ax} ${m} ${bx} ${m} ${bx} ${y2}`;
    } else {
      const sg = Math.sign(dx) || 1, x1 = ax + sg * aw / 2, x2 = bx - sg * bw / 2, m = (x1 + x2) / 2;
      d = `M${x1} ${ay} C${m} ${ay} ${m} ${by} ${x2} ${by}`;
    }
    out += `<path class="mm-line" pathLength="1" d="${d}"/>`;
  });
  svg.innerHTML = out;
}
const layoutAll = () => document.querySelectorAll('.mm').forEach(layoutMM);

let busy = false, pending = null, settleT = 0, confettiId = 0;

function swap(n) {
  slides.forEach((s, idx) => { s.classList.toggle('active', idx === n); s.classList.remove('settled'); });
  i = n;
  slides.forEach((s, idx) => s.querySelectorAll('svg').forEach(v => {
    const inMorph = document.getElementById('stage').classList.contains('morphing');
    if (idx === n && !inMorph) v.unpauseAnimations && v.unpauseAnimations(); else v.pauseAnimations && v.pauseAnimations();
  }));
  const cur = document.getElementById('cur');
  cur.textContent = i + 1;
  cur.animate && cur.animate([{ transform: 'translateY(-9px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 500, easing: 'cubic-bezier(.22,1,.36,1)' });
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === total - 1 ? 'Selesai ✓' : 'Lanjut →';
  document.getElementById('progress').style.setProperty('--p', ((i + 1) / total * 100).toFixed(1));
  renderDots();
  slides[n].querySelectorAll('.mm').forEach(layoutMM);
  clearTimeout(settleT);
  settleT = setTimeout(() => slides[i].classList.add('settled'), 2300);
  confettiId++;
  clearConfetti();
  if (i === total - 1) { const id = confettiId; setTimeout(() => burst(id), 800); }
}

/* Durasi lebih pendek + kurva ease-in-out halus (sebelumnya 1600ms, terasa lambat & patah) */
const MD = 1300, ME = 'cubic-bezier(.4,0,.12,1)'; /* mulai lembut, mendarat sangat halus */

function show(n, dir) {
  if (dir === undefined) { swap(n); return; }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { swap(n); return; }
  morph(n);
}

/* rect objek; dekorasi memakai ukuran layout (kebal terhadap rotasi/spin) */
function mrect(el) {
  const r = el.getBoundingClientRect();
  if (!el.dataset.deco) return r;
  const s = parseFloat(getComputedStyle(el).scale) || 1;
  const w = el.offsetWidth * s, h = el.offsetHeight * s;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  return { left: cx - w / 2, top: cy - h / 2, width: w, height: h };
}
/* transform yang memetakan rect a -> b (pusat ke pusat) */
function tf(a, b, uni) {
  let sx = (b.width || 1) / (a.width || 1), sy = (b.height || 1) / (a.height || 1);
  if (uni) sx = sy = Math.min(sx, sy);
  return { dx: (b.left + b.width / 2) - (a.left + a.width / 2), dy: (b.top + b.height / 2) - (a.top + a.height / 2), sx, sy };
}
function ghostOf(el, r, sr) {
  const g = el.cloneNode(true);
  g.classList.remove('pop', 'toc-item', 'mx');
  g.removeAttribute('data-m'); g.removeAttribute('data-deco');
  Object.assign(g.style, {
    left: (r.left - sr.left) + 'px', top: (r.top - sr.top) + 'px',
    width: r.width + 'px', height: r.height + 'px',
    fontSize: getComputedStyle(el).fontSize, opacity: '1', visibility: 'visible', transform: 'none'
  });
  return g;
}

function morph(n) {
  busy = true;
  const stage = document.getElementById('stage'), layer = document.getElementById('morph-layer');
  const sr = stage.getBoundingClientRect();
  const oldS = slides[i], newS = slides[n];
  stage.classList.add('morphing');

  const olds = {};
  oldS.querySelectorAll('[data-m]').forEach(el => olds[el.dataset.m] = el);
  const pairs = [];
  newS.classList.add('measure');
  newS.querySelectorAll('[data-m]').forEach(nel => {
    const oel = olds[nel.dataset.m]; if (!oel) return;
    pairs.push({ key: nel.dataset.m, oel, nel, a: mrect(oel), b: mrect(nel), deco: !!nel.dataset.deco });
  });
  newS.classList.remove('measure');

  pairs.forEach(p => {
    if (!p.deco) {
      p.g = ghostOf(p.oel, p.a, sr); layer.appendChild(p.g);
      /* ghost tidak perlu menjalankan animasi SVG sendiri */
      (p.g.matches('svg') ? [p.g] : [...p.g.querySelectorAll('svg')]).forEach(s => s.pauseAnimations && s.pauseAnimations());
    }
    p.oel.style.visibility = 'hidden';
    p.nel.classList.add('mx');
  });
  oldS.classList.add('leaving');
  swap(n);

  const A = [];
  const an = (el, kf, o) => { const a = el.animate(kf, Object.assign({ duration: MD, easing: ME, fill: 'both' }, o)); A.push(a); return a; };
  /* slide lama memudar lembut sambil sedikit mengecil, tanpa lompatan */
  an(oldS, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.97)' }], { duration: MD * .6, easing: 'cubic-bezier(.4,0,.6,1)' });

  pairs.forEach(p => {
    const uni = p.key === 'head' || p.key === 'scene';
    const f = tf(p.b, p.a, uni);
    if (p.deco) {
      /* dekorasi (matahari/awan/planet/bulan): animasikan properti translate/rotate/scale terpisah.
         Jadi animasi CSS bawaan (spin/drift/float) tetap jalan dan TIDAK direstart/loncat saat transisi selesai. */
      const cs = getComputedStyle(p.nel);
      const tr = cs.translate === 'none' ? [0, 0] : cs.translate.split(' ').map(parseFloat);
      const tx0 = tr[0] || 0, ty0 = tr[1] || 0;
      const r0 = parseFloat(p.oel.style.rotate) || 0, r1 = parseFloat(p.nel.style.rotate) || 0;
      const s0 = p.a.width / (p.nel.offsetWidth || 1), s1 = parseFloat(cs.scale) || 1;
      an(p.nel, [
        { translate: `${tx0 + f.dx}px ${ty0 + f.dy}px`, rotate: `${r0}deg`, scale: String(s0) },
        { translate: `${tx0}px ${ty0}px`, rotate: `${r1}deg`, scale: String(s1) }
      ]);
    } else {
      an(p.nel, [
        { transform: `translate(${f.dx}px,${f.dy}px) scale(${f.sx},${f.sy})` },
        { transform: 'translate(0px,0px) scale(1,1)' }
      ]);
    }
    if (!p.deco) {
      /* crossfade lebih lebar & tumpang tindih → tidak ada "kedip" saat pergantian */
      /* PENTING: keyframe akhir (offset 1) harus eksplisit. Tanpa itu, browser menambah keyframe akhir
         dari nilai asli (opacity 1) sehingga ghost slide lama muncul lagi di ujung transisi lalu
         hilang mendadak saat dibersihkan = penyebab "lag" di akhir transisi. */
      an(p.nel, [{ opacity: 0, offset: 0 }, { opacity: .15, offset: .2 }, { opacity: 1, offset: .75 }, { opacity: 1, offset: 1 }], { easing: 'linear' });
      const g = tf(p.a, p.b, uni);
      an(p.g, [{ transform: 'translate(0px,0px) scale(1,1)' }, { transform: `translate(${g.dx}px,${g.dy}px) scale(${g.sx},${g.sy})` }]);
      an(p.g, [{ opacity: 1, offset: 0 }, { opacity: .85, offset: .5 }, { opacity: 0, offset: .85 }, { opacity: 0, offset: 1 }], { easing: 'linear' });
    }
  });
  /* dekorasi baru tanpa pasangan: muncul perlahan */
  const paired = new Set(pairs.map(p => p.nel));
  newS.querySelectorAll('[data-deco]').forEach(el => {
    if (!paired.has(el)) an(el, [{ opacity: 0 }, { opacity: 1 }], { duration: MD * .6, delay: MD * .3, easing: 'ease' });
  });

  setTimeout(() => {
    A.forEach(a => a.cancel());
    layer.innerHTML = '';
    pairs.forEach(p => { p.oel.style.visibility = ''; p.nel.classList.remove('mx'); });
    oldS.classList.remove('leaving');
    stage.classList.remove('morphing');
    /* lanjutkan animasi SVG slide baru setelah transisi selesai */
    slides[i].querySelectorAll('svg').forEach(v => v.unpauseAnimations && v.unpauseAnimations());
    busy = false;
    /* klik cepat tidak lagi diabaikan: dijalankan setelah transisi selesai */
    if (pending !== null) { const p = pending; pending = null; go(p); }
  }, MD + 150);
}

function go(n) {
  if (n < 0 || n >= total) return;
  if (busy) { pending = n; return; }
  if (n === i) return;
  show(n, n > i ? 1 : -1);
}
function goDir(d) { go((pending !== null ? pending : i) + d); }

/* confetti di slide terakhir */
const cv = document.getElementById('confetti');
function clearConfetti() { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); }
function burst(id) {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const ctx = cv.getContext('2d');
  const cols = ['#f4e04d', '#c5e384', '#7b7fd6', '#e8903a', '#a9c8ee', '#ffffff'];
  const ps = Array.from({ length: 150 }, () => ({
    x: cv.width / 2, y: cv.height * 0.58,
    vx: (Math.random() - .5) * 20 * dpr, vy: (-Math.random() * 17 - 7) * dpr,
    s: (Math.random() * 7 + 5) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .5,
    c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < .35
  }));
  let t = 0;
  (function step() {
    if (id !== confettiId) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    const fade = t > 170 ? Math.max(0, 1 - (t - 170) / 60) : 1; /* pudar halus di akhir */
    ctx.globalAlpha = fade;
    ps.forEach(p => {
      p.vy += .42 * dpr; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (++t < 230) requestAnimationFrame(step); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goDir(1); }
  else if (e.key === 'ArrowLeft') goDir(-1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(total - 1);
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

let tx = 0;
document.getElementById('stage').addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
document.getElementById('stage').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - tx;
  if (Math.abs(dx) > 50) goDir(dx < 0 ? 1 : -1);
}, { passive: true });

// stars
(function () {
  const box = document.getElementById('stars');
  for (let s = 0; s < 28; s++) {
    const el = document.createElement('div');
    el.className = 'star';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = Math.random() * 100 + '%';
    el.style.animationDelay = Math.random() * 3 + 's';
    const sz = (Math.random() * 2 + 2) + 'px';
    el.style.width = el.style.height = sz;
    box.appendChild(el);
  }
})();

document.getElementById('tot').textContent = total;
renderSlides();
slides = [...document.querySelectorAll('.slide')];
/* penanda objek untuk morph (seperti "!!nama" di PowerPoint) */
const MAPS = [
  { head: '[style*="background:var(--purple)"]', scene: 'svg[class*="ic-scene"]' },
  { head: '.pop.p1', 'c*': '.member' },
  { head: '.pop.p1', panel: '.pop.p2' },
  { head: '.pop.p1 .h2', scene: 'svg[class*="ic-scene"]', 'c*': '.pop.p2, .pop.p3' },
  { head: '.pop.p1', panel: '.pop.p2', scene: 'svg[class*="ic-scene"]' },
  { head: '.pop.p1', panel: '.pop.p3', scene: 'svg[class*="ic-scene"]' },
  { head: '.mm-root', 'c*': '.mm-n.leaf' },
  { head: '.pop.p1', scene: 'svg[class*="ic-scene"]', 'c*': '.wrap > div:last-child > div:last-child > .pop' },
  { head: '.mm-root', scene: 'svg[class*="ic-scene"]', 'c*': '.mm-n.leaf' },
  { head: '.pop.p1', panel: '.pop.p2', 'c*': '.pop[style*="width:104px"]' },
  { head: '.pop.p1', c1: '.pop.p2' }
];
slides.forEach((sl, n) => {
  const sp = MAPS[n] || {};
  for (const k in sp) {
    if (k.endsWith('*')) sl.querySelectorAll(sp[k]).forEach((el, j) => el.dataset.m = k.slice(0, -1) + (j + 1));
    else { const el = sl.querySelector(sp[k]); if (el) el.dataset.m = k; }
  }
  const set = (s, k, j = 0) => { const el = sl.querySelectorAll(s)[j]; if (el) { el.dataset.m = k; el.dataset.deco = '1'; } };
  set('.sun', 'd-sun'); set('.planet', 'd-pl'); set('.moon', 'd-mo'); set('.cloud', 'd-c1', 0); set('.cloud', 'd-c2', 1);
});
// variasi rotasi per slide, supaya objek berputar saat morph
slides.forEach((sl, n) => sl.querySelectorAll('.deco').forEach((d, k) => {
  let r = ((n * 53 + k * 29) % 41) - 20;
  if (d.classList.contains('planet')) r = ((n * 61) % 90) - 45;
  else if (d.classList.contains('moon')) r = ((n * 37) % 60) - 30;
  else if (d.classList.contains('cloud')) r = r / 2.5;
  else if (d.classList.contains('sun')) r = 0;
  d.style.rotate = r + 'deg';
}));
const FROM = ['translateY(30px) scale(.9)', 'translateX(-36px) rotate(-3deg) scale(.93)', 'translateX(36px) rotate(3deg) scale(.93)', 'scale(.6) rotate(-6deg)'];
slides.forEach(s => s.querySelectorAll('.pop').forEach((el, k) => el.style.setProperty('--from', FROM[k % FROM.length])));
document.querySelectorAll('.blob').forEach(b => b.style.setProperty('--md', (-Math.random() * 8).toFixed(2) + 's'));
(function () { const sh = document.createElement('div'); sh.className = 'shoot'; document.getElementById('stars').appendChild(sh); })();

/* parallax mouse — sekarang pakai interpolasi (lerp) per frame supaya mengalir, bukan loncat */
const stageEl = document.getElementById('stage');
const parEls = [...document.querySelectorAll('.deco')], starsEl = document.getElementById('stars');
let tgx = 0, tgy = 0, cx = 0, cy = 0;
stageEl.addEventListener('mousemove', e => {
  tgx = e.clientX / innerWidth - .5; tgy = e.clientY / innerHeight - .5;
}, { passive: true });
stageEl.addEventListener('mouseleave', () => { tgx = 0; tgy = 0; });
(function parallax() {
  cx += (tgx - cx) * .07; cy += (tgy - cy) * .07;
  if (!stageEl.classList.contains('morphing') && (Math.abs(tgx - cx) > .0005 || Math.abs(tgy - cy) > .0005)) {
    const tr = (cx * 22).toFixed(2) + 'px ' + (cy * 14).toFixed(2) + 'px';
    parEls.forEach(el => el.style.translate = tr);
    starsEl.style.translate = (-cx * 14).toFixed(2) + 'px ' + (-cy * 10).toFixed(2) + 'px';
  }
  requestAnimationFrame(parallax);
})();
// scroll mouse / trackpad
let wheelAt = 0;
stageEl.addEventListener('wheel', e => {
  const now = Date.now();
  if (now - wheelAt < 900 || Math.abs(e.deltaY) < 30) return;
  wheelAt = now; goDir(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

layoutAll();
addEventListener('resize', layoutAll);
document.fonts && document.fonts.ready.then(layoutAll);
swap(0);
</script>
</body>
