<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olahraga Renang</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#0e2f4f;--coral:#ff6b5e;--sun:#ffd23f;--aqua:#27c4e8;--teal:#14a39a;--cream:#fffdf5;--mint:#9be8d0;--pink:#ffb3c7;--sky:#a8dcff;--peach:#ffc98a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a6f9a;font-family:'Quicksand','Patrick Hand',system-ui,sans-serif;color:var(--ink)}
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#5fd8f5 0%,#23b5e0 38%,#0e86bd 75%,#0a5f94 100%)}
.rays{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rays i{position:absolute;top:-10%;width:22%;height:130%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transform:skewX(-18deg);animation:ray 9s ease-in-out infinite alternate}
.rays i:nth-child(1){left:8%}.rays i:nth-child(2){left:42%;width:14%;animation-delay:-3s}.rays i:nth-child(3){left:72%;animation-delay:-6s}
@keyframes ray{from{opacity:.25;transform:skewX(-18deg) translateX(-12px)}to{opacity:.8;transform:skewX(-18deg) translateX(18px)}}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(18px)}}
.waves{position:absolute;left:0;bottom:0;width:100%;height:20%;pointer-events:none;overflow:hidden}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 9s linear infinite}
.waves svg.b{animation-duration:14s;animation-direction:reverse;bottom:-6px;opacity:.8}
@keyframes wv{to{transform:translateX(-50%)}}
.deco{position:absolute;z-index:1;pointer-events:none;transition:left 1.1s cubic-bezier(.34,1.25,.5,1),top 1.1s cubic-bezier(.34,1.25,.5,1),transform 1.1s cubic-bezier(.34,1.25,.5,1)}
.deco .in{width:100%;height:100%;animation:fl 5s ease-in-out infinite alternate}
.deco svg{width:100%;height:100%;overflow:visible}
@keyframes fl{from{transform:translateY(-5px) rotate(-3deg)}to{transform:translateY(7px) rotate(3deg)}}
#sun{width:84px;height:84px}#c1{width:108px;height:56px}#c2{width:84px;height:44px}#ball{width:58px;height:58px}#shell{width:50px;height:50px}
#sun .in{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#slides{position:absolute;inset:0;z-index:2}
.slide{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:46px 14px 150px;overflow:hidden}
.slide.on{display:flex}
.wrap{width:100%;max-width:1120px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pop{will-change:transform,opacity}
.ttl{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:30px 34px 28px 36px/34px 28px 36px 30px;box-shadow:4px 5px 0 var(--ink);padding:6px 20px 7px;font-family:Fredoka,'Baloo 2',sans-serif;font-weight:700;font-size:24px;line-height:1.15;text-align:center;color:var(--ink);transform-origin:0 0}
.ttl small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:1px}
.ttl.big{background:transparent;border:none;box-shadow:none;color:#fff;font-size:44px;line-height:1.02;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:1px;padding:0}
.sub{font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;background:var(--cream);border:2.5px solid var(--ink);border-radius:20px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink);text-align:center}
.intro{font-weight:700;font-size:14px;text-align:center;color:#fff;text-shadow:0 2px 0 rgba(14,47,79,.55);max-width:620px}
.pool{position:relative;width:100%;max-width:560px;aspect-ratio:2/1;max-height:200px;border:3px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;box-shadow:5px 6px 0 var(--ink);overflow:hidden;background:linear-gradient(180deg,#e9fbff 0%,#bdeeff 42%,#52c6ee 100%);transform-origin:0 0}
.pool svg{position:absolute;inset:0;width:100%;height:100%}
.pool.big{max-width:620px;max-height:260px}
.tag{position:absolute;top:8px;left:10px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:14px;padding:1px 10px;font-family:Fredoka,sans-serif;font-weight:600;font-size:12px;z-index:3;box-shadow:2px 2px 0 var(--ink)}
.cards{display:grid;gap:9px;width:100%;max-width:560px}
.card{position:relative;background:var(--cream);border:3px solid var(--ink);border-radius:22px 26px 20px 28px/26px 20px 28px 22px;box-shadow:4px 5px 0 var(--ink);display:flex;gap:11px;align-items:center;padding:8px 12px 8px 9px;transform-origin:0 0}
.card .ic{width:56px;height:56px;flex:none;background:var(--c,var(--sky));border:2.5px solid var(--ink);border-radius:50%;overflow:hidden;display:grid;place-items:center}
.card .ic svg{width:100%;height:100%;overflow:visible}
.card .ic.sq svg{transform:scale(1.15)}
.card h3{font-family:Fredoka,sans-serif;font-weight:700;font-size:16px;line-height:1.1;margin-bottom:2px}
.card p{font-size:12.5px;line-height:1.25;font-weight:600;opacity:.88}
.card .no{position:absolute;top:-10px;right:10px;background:var(--coral);color:#fff;border:2px solid var(--ink);border-radius:12px;font-family:Fredoka,sans-serif;font-weight:700;font-size:12px;padding:0 8px}
.txtcard{background:var(--cream);border:3px solid var(--ink);border-radius:26px 30px 24px 32px/30px 24px 32px 26px;box-shadow:5px 6px 0 var(--ink);padding:14px 16px;font-size:14.5px;line-height:1.42;font-weight:600;width:100%;max-width:560px}
.txtcard b{background:linear-gradient(transparent 58%,#ffe27a 58%)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--pink);border:2.5px solid var(--ink);border-radius:18px;padding:3px 12px;font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;box-shadow:2px 3px 0 var(--ink)}
.chip:nth-child(2){background:var(--mint)}.chip:nth-child(3){background:var(--sun)}
.blist{list-style:none;width:100%;max-width:560px;display:flex;flex-direction:column;gap:7px}
.blist li{display:flex;gap:9px;align-items:flex-start;background:var(--cream);border:2.5px solid var(--ink);border-radius:16px 20px 16px 20px;box-shadow:3px 4px 0 var(--ink);padding:6px 10px;font-size:13px;line-height:1.28;font-weight:700}
.blist li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;border:2px solid var(--ink);font:700 12px/18px Fredoka,sans-serif;text-align:center;font-style:normal}
.mm{position:relative;width:100%;max-width:760px;height:min(100%,400px)}
.mm svg.lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.mm svg.lines path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.slide.on .mm svg.lines path{animation:draw .9s .45s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mm-c{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:4px 5px 0 var(--ink);display:grid;place-items:center;text-align:center;font:700 15px/1.05 Fredoka,sans-serif;z-index:2}
.mm-n{position:absolute;width:45%;background:var(--cream);border:3px solid var(--ink);border-radius:22px 26px 20px 28px/26px 20px 28px 22px;box-shadow:4px 5px 0 var(--ink);padding:6px 7px 8px;z-index:1;text-align:center;cursor:pointer}
.mm-n h4{font:700 14px Fredoka,sans-serif;margin-bottom:2px}.mm-n p{font-size:11.5px;font-weight:700;opacity:.85;line-height:1.15}
.mm-n .pool{max-height:none;box-shadow:none;border-width:2.5px;border-radius:14px;margin-bottom:4px}
.mm-n.n0{left:0;top:0}.mm-n.n1{right:0;top:0}.mm-n.n2{left:0;bottom:0}.mm-n.n3{right:0;bottom:0}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:560px}
.toc .card{cursor:pointer;padding:7px 9px}
.toc .card h3{font-size:14.5px;margin:0}
.toc .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);border:2.5px solid var(--ink);font:700 17px/29px Fredoka,sans-serif;text-align:center}
.members{display:flex;gap:10px;justify-content:center;width:100%}
.member{flex:1;max-width:170px;background:var(--cream);border:3px solid var(--ink);border-radius:24px 28px 22px 30px/28px 22px 30px 24px;box-shadow:4px 5px 0 var(--ink);padding:6px 4px 9px;text-align:center;font:700 13px Fredoka,sans-serif}
.member .av{height:92px;margin-bottom:2px}.member .av svg{width:100%;height:100%}
.go{background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:24px;padding:8px 26px;font:700 18px Fredoka,sans-serif;box-shadow:4px 5px 0 var(--ink);cursor:pointer;transition:transform .15s}
.go:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.cch{pointer-events:auto!important;cursor:pointer;position:absolute;bottom:60px;width:68px;height:90px;z-index:5;pointer-events:none;transform-origin:0 0}
.cch svg{width:100%;height:100%;overflow:visible}
.cch.R{right:12px}.cch.L{left:12px}
.cch .g-body{animation:cb 1.6s ease-in-out infinite;transform-origin:40px 98px}.cch .g-arm{animation:cw 1.1s ease-in-out infinite;transform-origin:58px 52px}
.cch .g-head{animation:ch 2.4s ease-in-out infinite;transform-origin:40px 44px}
.cch .g-eye{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}
.cch .g-mouth{animation:mo 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes cb{50%{transform:scale(1.02,.97)}}@keyframes cw{50%{transform:rotate(-24deg)}}@keyframes ch{50%{transform:rotate(3deg)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes mo{50%{transform:scale(1,.55)}}
.say{position:absolute;bottom:92px;max-width:calc(100% - 110px);background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:3px 4px 0 var(--ink);padding:7px 12px;font:700 13px/1.25 Fredoka,sans-serif;z-index:5;pointer-events:none}
.say.R{right:78px}.say.L{left:78px}
.say:after{content:"";position:absolute;bottom:-9px;width:14px;height:14px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.say.R:after{right:16px}.say.L:after{left:16px}
.slide.on .say{animation:sp .6s .55s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes sp{from{transform:scale(.2);opacity:0}}
.bar{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:30;display:flex;align-items:center;justify-content:center;gap:12px}
.btn{height:42px;min-width:92px;padding:0 16px;border-radius:22px;border:3px solid var(--ink);background:var(--sun);font:700 16px Fredoka,sans-serif;color:var(--ink);box-shadow:3px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.btn[disabled]{opacity:.45}
.btn.nx{background:var(--coral);color:#fff}
.dots{display:flex;gap:5px;max-width:34vw;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid var(--ink);transition:all .3s}.dots i.on{background:var(--sun);transform:scale(1.45)}
.cnt{position:absolute;top:10px;left:12px;z-index:30;background:var(--cream);border:2.5px solid var(--ink);border-radius:14px;padding:1px 10px;font:700 13px Fredoka,sans-serif;box-shadow:2px 3px 0 var(--ink)}
.fs,.hint{display:none}
@media(max-width:360px){.ttl{font-size:21px}.ttl.big{font-size:38px}}
@media(min-width:900px){
 .slide{padding:58px 40px 178px;gap:12px}
 .ttl{font-size:38px;padding:8px 30px 10px}.ttl small{font-size:18px}.ttl.big{font-size:92px;-webkit-text-stroke:10px var(--ink);text-shadow:0 9px 0 var(--ink)}
 .sub{font-size:20px;padding:6px 20px}.intro{font-size:19px;max-width:820px}
 .pool{max-width:700px;max-height:none}.pool.big{max-width:640px}
 .tag{font-size:15px;top:12px;left:14px}
 .cards{max-width:1100px;grid-template-columns:repeat(var(--cols,3),1fr);gap:18px}
 .card{flex-direction:column;text-align:center;padding:18px 14px 16px;gap:8px}
 .card .ic{width:116px;height:116px;border-width:3px}
 .card h3{font-size:22px}.card p{font-size:15px;line-height:1.32}
 .card .no{font-size:15px;top:-12px;right:14px}
 .txtcard{font-size:19px;padding:22px 26px;max-width:700px}
 .chip{font-size:17px;padding:5px 18px}
 .blist{max-width:560px;gap:11px}.blist li{font-size:17px;padding:9px 14px;gap:12px}.blist li i{width:28px;height:28px;font-size:15px;line-height:23px}
 .stroke .wrap{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr;gap:20px 40px;align-items:center;max-width:1100px}.stroke .wrap>.ttl{grid-column:1/-1;justify-self:center}
 .stroke .pool{max-width:none;max-height:none}.stroke .blist{max-width:none}
 .mm{max-width:1000px;height:min(100%,420px)}.mm-c{width:130px;height:130px;margin:-65px 0 0 -65px;font-size:21px}
 .mm-n{width:30%;padding:10px 12px}.mm-n h4{font-size:20px}.mm-n p{font-size:15px}
 .toc{grid-template-columns:repeat(4,1fr);max-width:1100px;gap:16px}
 .toc .card{flex-direction:column;padding:16px 8px;gap:8px}.toc .card h3{font-size:19px}.toc .num{width:52px;height:52px;font-size:26px;line-height:46px}
 .members{gap:24px}.member{max-width:230px;font-size:18px;padding:10px 8px 14px}.member .av{height:150px}
 .go{font-size:24px;padding:12px 40px}
 .cch{width:96px;height:126px;bottom:64px}.cch.R{right:30px}.cch.L{left:30px}
 .say{font-size:17px;padding:10px 18px;bottom:128px;max-width:520px}.say.R{right:132px}.say.L{left:132px}
 #sun{width:120px;height:120px}#c1{width:150px;height:78px}#c2{width:116px;height:60px}#ball{width:80px;height:80px}#shell{width:68px;height:68px}
 .fs{display:block;position:absolute;top:10px;right:14px;z-index:30;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-size:18px;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
 .hint{display:block;position:absolute;right:20px;bottom:18px;z-index:30;color:#fff;font:600 13px Fredoka,sans-serif;opacity:.85}
 .btn{height:46px;font-size:18px}.dots{max-width:50vw}.dots i{width:11px;height:11px}
}

#ghosts{position:absolute;inset:0;z-index:4;pointer-events:none}
.ttl.big span{display:inline-block;animation:lw 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
@keyframes lw{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.12em) rotate(-3deg)}}
.slide.on .card .ic{animation:icp .8s cubic-bezier(.3,1.9,.5,1) calc(.85s + var(--n,0)*.09s) backwards}
.slide.on .mm-n .pool{animation:icp .8s cubic-bezier(.3,1.9,.5,1) calc(.9s + var(--n,0)*.1s) backwards}
@keyframes icp{from{transform:scale(0) rotate(-40deg)}}
.slide.on .mm-c{animation:mmc 2.4s ease-in-out 1.4s infinite}
@keyframes mmc{50%{transform:scale(1.07)}}
.slide.on .go{animation:gop 1.4s ease-in-out 1.5s infinite}@keyframes gop{50%{transform:scale(1.07)}}
.card,.mm-n,.member{transition:translate .25s cubic-bezier(.3,1.6,.5,1)}.card:hover,.mm-n:hover,.member:hover{translate:0 -5px}
.blist li{transition:translate .25s}.blist li:hover{translate:4px 0}
</style></head><body>
<div class="stage">
<div class="rays"><i></i><i></i><i></i></div>
<div id="decos"></div><div id="ghosts"></div>
<div class="waves"><svg class="b" viewBox="0 0 2400 120" preserveAspectRatio="none"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" fill="#1b9ed0"/></svg><svg viewBox="0 0 2400 120" preserveAspectRatio="none" style="opacity:.55"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" fill="#0a6f9a"/></svg></div>
<div id="slides"></div>
<div class="cnt"></div><button class="fs" title="Layar penuh (F)">⛶</button><div class="hint">← → ganti slide · F layar penuh</div>
<div class="bar"><button class="btn" id="prev">◂ Balik</button><div class="dots"></div><button class="btn nx" id="next">Lanjut ▸</button></div>
</div>
<script>/* =========================================================
   B1 — HELPER SMIL, PERENANG (tampak samping), ORANG (tampak depan), PELATIH
   ========================================================= */
const INK = '#0e2f4f', SKIN = '#f6c9a0', SKIN2 = '#dba477', SUIT = '#ff6b5e', SUIT2 = '#d9483f', CAP = '#ffd23f', TRUNK = '#2b6cb0';
const KS = '.45 0 .55 1';
const spl = n => Array(n - 1).fill(KS).join(';');

/* grup yang berputar (nilai tunggal = statis, array = animasi berulang) */
function rotG(v, dur, beg, inner, kt, lin) {
  if (!Array.isArray(v)) return v ? `<g transform="rotate(${v})">${inner}</g>` : inner;
  const n = v.length, times = kt || v.map((_, i) => (i / (n - 1)).toFixed(3)).join(';');
  return `<g><animateTransform attributeName="transform" type="rotate" values="${v.join(';')}" keyTimes="${times}" dur="${dur}s" begin="${-beg}s" repeatCount="indefinite" ${lin ? 'calcMode="linear"' : `calcMode="spline" keySplines="${spl(n)}"`}/>${inner}</g>`;
}
/* grup yang bergeser: v = [[x,y],...] */
function moveG(v, dur, beg, inner, kt, lin) {
  if (!Array.isArray(v)) return inner;
  const n = v.length, times = kt || v.map((_, i) => (i / (n - 1)).toFixed(3)).join(';');
  return `<g><animateTransform attributeName="transform" type="translate" values="${v.map(p => p.join(' ')).join(';')}" keyTimes="${times}" dur="${dur}s" begin="${-beg}s" repeatCount="indefinite" ${lin ? 'calcMode="linear"' : `calcMode="spline" keySplines="${spl(n)}"`}/>${inner}</g>`;
}
/* anggota badan 2 ruas (bahu/pinggul → siku/lutut) dengan garis tepi */
function limb(px, py, base, l1, l2, A, B, dur, beg, lag, col, w, tip, k) {
  k = k || {};
  const c2 = k.c2 || col, ink = w + 2.6;
  const lower = `<line x2="${l2}" stroke="${INK}" stroke-width="${ink}" stroke-linecap="round"/><line x2="${l2}" stroke="${c2}" stroke-width="${w}" stroke-linecap="round"/>${tip || ''}`;
  const upper = `<line x2="${l1}" stroke="${INK}" stroke-width="${ink}" stroke-linecap="round"/><g transform="translate(${l1} 0)">${rotG(B, dur, beg + lag, lower, k.Bk, k.Bl)}</g><line x2="${l1}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<g transform="translate(${px} ${py}) rotate(${base})">${rotG(A, dur, beg, upper, k.Ak, k.Al)}</g>`;
}
const handT = (l2, c) => `<circle cx="${l2}" r="3" fill="${c}" stroke="${INK}" stroke-width="1.2"/>`;
const footT = (l2, c) => `<ellipse cx="${l2 + 1.6}" cy=".4" rx="4.3" ry="2.4" fill="${c}" stroke="${INK}" stroke-width="1.2"/>`;

/* kepala tampak samping, menghadap kanan */
function headG(x, y, o = {}) {
  const mouth = o.mouthO
    ? `<ellipse cx="5.8" cy="4.9" rx="1.7" ry="2" fill="#7a2a2a"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="${o.mkt || '0;.5;.6;.88;1'}" dur="${o.D}s" begin="${-(o.beg || 0)}s" repeatCount="indefinite"/></ellipse>`
    : `<path d="M2.6 4.5 Q5.2 6.5 7.6 4.1" stroke="#8a3a3a" stroke-width="1.25" fill="none" stroke-linecap="round"/>`;
  const face = `<circle r="8.3" fill="${SKIN}" stroke="${INK}" stroke-width="1.6"/>
    <path d="M-8.2 1.6 C-9.4 -8 -1 -10.8 5.6 -7.5 C8.9 -5.6 9.3 -1 8.4 .8 Q0 -2 -8.2 1.6Z" fill="${o.cap || CAP}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-7.8 -1.4 L1.2 -2.7" stroke="${INK}" stroke-width="1.1" opacity=".5"/>
    <circle cx="4.3" cy="-.3" r="3.2" fill="#c9f1ff" stroke="${INK}" stroke-width="1.2"/><circle cx="5" cy="-.3" r="1.15" fill="${INK}"/><path d="M2.9 -1.8 l1.4 -.5" stroke="#fff" stroke-width=".9" stroke-linecap="round"/>
    ${mouth}`;
  return `<g transform="translate(${x} ${y})">${rotG(o.rot === undefined ? 0 : o.rot, o.D || 2, o.beg || 0, face, o.kt)}</g>`;
}
/* gelembung napas */
function puff(x, y, D, at, big) {
  let s = '';
  [[0, 0, 1.6], [3, -4, 1.2], [-2, -8, 1.9]].forEach((b, i) => {
    const r = b[2] * (big ? 1.35 : 1), t = (at + i * .035) * D;
    s += `<circle cx="${x + b[0]}" cy="${y + b[1]}" r="${r}" fill="#e9fbff" stroke="#8fd8ff" stroke-width=".6" opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;${-2 + i} -${16 + i * 3}" dur="${D * .38}s" begin="${t}s;${t + D}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;0" dur="${D * .38}s" begin="${t}s;${t + D}s" repeatCount="indefinite"/></circle>`;
  });
  return s;
}

function swimG(st, o = {}) {
  const arm = (c, beg, A, B, D, k) => limb(88, 40, 0, 15, 14, A, B, D, beg, .07, c, 5, handT(14, c), k);

  let far = '', near = '', body = '', headS = '', extra = '', wrap = v => v;

  if (st === 'free' || st === 'breath') {

    const ak = { Ak: '0;.42;1', Al: true, Bk: '0;.2;.42;.7;1' };

    wrap = v => moveG([[0, 0], [0, 1.4], [0, 0]], D, 0, v);
  } else if (st === 'back') {

    far = arm(SKIN2, D / 2, aA, aB, D, ak) + leg(SKIN2, .23, [-12, 12, -12], [8, -22, 8], .5);
    near = leg(SKIN, 0, [-12, 12, -12], [8, -22, 8], .5) + arm(SKIN, 0, aA, aB, D, ak);

    near = leg(SKIN, 0, lA, lB, D, lk) + arm(SKIN, 0, aA, aB, D, ak);
    headS = headG(99, 35.2, { rot: [0, -12, -20, 0, 0], kt: '0;.3;.5;.72;1', D, mouthO: true, mkt: '0;.35;.45;.62;1' }) + puff(106, 39, D, .55);
    wrap = v => moveG([[0, 1.5], [0, -3.2], [0, 1.5], [0, 2.4], [0, 1.5]], D, 0, v, '0;.3;.52;.8;1');
  } else if (st === 'fly') {
    const D = 1.5, ak = { Ak: '0;.4;1', Al: true, Bk: '0;.2;.4;.7;1' };
    const aA = [-180, -3, 180], aB = [30, 12, -6, 26, 30];
    const kA = [-18, 18, -18], kB = [14, -18, 14];

    near = leg(SKIN2, .1, kA, kB, D / 2) + leg(SKIN, 0, kA, kB, D / 2) + arm(SKIN, 0, aA, aB, D, ak);
    headS = headG(99, 35.2, { rot: [8, -4, -26, -26, 8], kt: '0;.3;.5;.8;1', D, mouthO: true, mkt: '0;.4;.5;.76;1' }) + puff(106, 39, D, .55);
    wrap = v => `<g>${`<animateTransform attributeName="transform" type="rotate" values="-5 88 40;5 88 40;-5 88 40" dur="${D / 2}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines="${spl(3)}"/>`}${v}</g>`;
  } else if (st === 'float') {

    near = leg(SKIN, 0, [4, -6, 4], [4, -2, 4], D) + arm(SKIN, .3, [-12, -4, -12], [4, 0, 4], D);

    near = leg(SKIN, 0, [-38, 0, 0, 0], [92, 0, 0, 0], D, { Ak: kt, Bk: kt }) + arm(SKIN, 0, [-6, 0, 0, -6], [30, 0, 0, 30], D, { Ak: kt, Bk: kt });
    headS = headG(99, 36.5, { rot: 18, D });

    wrap = v => `<g><animateTransform attributeName="transform" type="translate" values="-14 0;-14 0;22 0;22 0" keyTimes="0;.14;.84;1" dur="${D}s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.1 .6 .3 1;0 0 1 1"/><animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.14;.8;.9;.97;1" dur="${D}s" repeatCount="indefinite"/>${v}</g>`;
  }
  const bodyAll = far + hipCap + torsoSide + near + headS + extra;
  return wrap(bodyAll);
}

  const aL = A('aL', [0, 0]), aR = A('aR', [0, 0]), lL = A('lL', [0, 0]), lR = A('lR', [0, 0]);
  const legs = vl(28, 42, 12, 12, lL[0], lL[1], TRUNK, SKIN, 6.2, footT(12, SKIN).replace('cx="13.6"', 'cx="13.6"'), ph) + vl(36, 42, 12, 12, lR[0], lR[1], TRUNK, SKIN, 6.2, footT(12, SKIN), ph);
  const armL = vl(25, 22, 10, 9, aL[0], aL[1], SKIN, SKIN, 4.4, handT(9, SKIN) + (aL[2] ? `<g transform="translate(9 0) rotate(-90)">${aL[2]}</g>` : ''), ph);
  const armR = vl(39, 22, 10, 9, aR[0], aR[1], SKIN, SKIN, 4.4, handT(9, SKIN) + (aR[2] ? `<g transform="translate(9 0) rotate(-90)">${aR[2]}</g>` : ''), ph);
  const hasH = p.head !== undefined;
  const head = rotG(hasH ? p.head : [-2.5, 2.5, -2.5], hasH ? d : d * 1.7, ph, `<rect x="29" y="17" width="6" height="5" fill="${SKIN}"/><circle cx="32" cy="11" r="8.6" fill="${SKIN}" stroke="${INK}" stroke-width="1.6"/>
    <path d="M23.4 11.4 C22.6 1.6 30 .2 35 .8 C40.8 1.6 42 7 40.6 11.4 Q32 8 23.4 11.4Z" fill="${p.cap || CAP}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>

    <path d="M28.6 16.2 Q32 19 35.4 16.2" stroke="#8a3a3a" stroke-width="1.25" fill="none" stroke-linecap="round"/>`.replace('<path d="M32 10.7 v0" stroke="' + INK + '" stroke-width="1"/>', ''));
  const trunkBand = `<rect x="23.6" y="38" width="16.8" height="6" rx="2.5" fill="${TRUNK}" stroke="${INK}" stroke-width="1.4"/>`;

}

SL[6] = `<div class="wrap">${ttl('4. Gaya Renang', '4 gaya utama')}<div class="mm"><svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div class="mm-c pop">GAYA<br>RENANG</div>${DATA.gaya.map((g, i) => `<div class="mm-n pop n${i}" style="--n:${i}" data-go="${7 + i}"><div class="pool">${BIG(g.id)}</div><h4>${g.nama}</h4><p>${g.ov}</p></div>`).join('')}</div></div>`;
DATA.gaya.forEach((g, i) => SL[7 + i] = `<div class="stroke">${strokeH(g, i)}</div>`);
SL[11] = `<div class="wrap">${ttl('5. Peraturan dalam Renang')}${cardsH(DATA.aturan, 3)}</div>`;
SL[12] = `<div class="wrap">${ttl('6. Peralatan Renang')}${cardsH(DATA.alat, 3)}</div>`;
SL[13] = `<div class="wrap">${ttl('7. Keselamatan di Kolam', '5 hal penting')}${cardsH(DATA.selamat, 3)}</div>`;
SL[14] = `<div class="wrap">${pool('free', 'big')}<h1 class="ttl big pop" data-vt="title">${wv("TERIMA<br>KASIH")}</h1><div class="sub pop">Selamat berenang dengan aman! 🏊</div></div>`;
const N = SL.length;

function render() {
  document.getElementById('decos').innerHTML = ['sun', 'c1', 'c2', 'ball', 'shell'].map(k => `<div class="deco" id="${k}"><div class="in">${DECOSVG[k === 'c1' || k === 'c2' ? 'cloud' : k]}</div></div>`).join('');
  document.getElementById('slides').innerHTML = SL.map((h, i) => `<section class="slide ${i >= 7 && i <= 10 ? 'stroke-s' : ''}" data-i="${i}">${h}${coachH(i)}</section>`).join('');
}

/* ---------------- MESIN MORPH ---------------- */
render();
const slides = [...document.querySelectorAll('.slide')];
const dots = document.querySelector('.dots'); dots.innerHTML = slides.map((_, i) => '<i></i>').join('');
const cnt = document.querySelector('.cnt'), prev = document.getElementById('prev'), next = document.getElementById('next');
const ghosts = document.getElementById('ghosts'); let cur = -1, busy = false, queued = null;
const smil = (el, on) => el.querySelectorAll('svg').forEach(s => { try { on ? s.unpauseAnimations() : s.pauseAnimations(); } catch (e) { } });
slides.forEach(s => smil(s, false));
function applyDeco(n) {
  const d = DECO[n], st = document.querySelector('.stage'), W = st.clientWidth, H = st.clientHeight;
  for (const k in d) { const el = document.getElementById(k); el.style.left = d[k][0] + '%'; el.style.top = d[k][1] + '%'; el.style.transform = `scale(${d[k][2]}) rotate(${(n * 37 + k.length * 11) % 20 - 10}deg)`; }
}
function enterKf(kind, dir, i) {
  const o = { opacity: 0 };
  switch (kind) {
    case 'rise': o.transform = `perspective(1000px) translate3d(0,${70 + i * 8}px,-120px) rotateX(38deg) scale(.92)`; break;
    case 'swing': o.transform = `perspective(1000px) translate3d(${dir * 90}px,20px,-200px) rotateY(${-dir * 40}deg) scale(.88)`; break;
    case 'zoom': o.transform = `scale(.45) rotate(${i % 2 ? 8 : -8}deg) translateY(30px)`; break;
    case 'drop': o.transform = `perspective(1000px) translate3d(0,-90px,-100px) rotateX(-30deg) scale(.9)`; break;
  }
  return [o, { opacity: 1, transform: 'none' }];
}
function show(n) {
  const old = cur >= 0 ? slides[cur] : null, nw = slides[n], dir = n >= cur ? 1 : -1;
  busy = true;
  const oldR = {}; if (old) old.querySelectorAll('[data-vt]').forEach(e => oldR[e.dataset.vt] = e);
  const oldRects = {}; for (const k in oldR) oldRects[k] = oldR[k].getBoundingClientRect();
  nw.classList.add('on'); nw.style.zIndex = 2; if (old) old.style.zIndex = 1;
  smil(nw, true); applyDeco(n); layoutMM(nw);
  const pops = [...nw.querySelectorAll('.pop')]; let ei = 0, si_ = 0, maxEnd = 700; splash();
  pops.forEach(e => {
    const k = e.dataset.vt, o = k && oldR[k];
    if (o) {
      const r = e.getBoundingClientRect(), b = oldRects[k], si = si_++;
      const dx = b.left - r.left, dy = b.top - r.top, sx = b.width / (r.width || 1), sy = b.height / (r.height || 1);
      o.style.visibility = 'hidden';
      const dl = si * 50, dist = Math.hypot(dx, dy), sg = si % 2 ? 1 : -1, lift = Math.min(46, dist * .14) * sg - 10, tilt = sg * Math.min(4, dist / 120), isC = k === 'coach';
      e.animate([{ transformOrigin: '0 0', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: isC ? 1 : 0 }, { transformOrigin: '0 0', transform: `translate(${dx * .5}px,${dy * .5 + lift}px) scale(${(1 + sx) / 2},${(1 + sy) / 2}) rotate(${tilt}deg)`, opacity: 1, offset: .55 }, { transformOrigin: '0 0', transform: 'translate(0,0) scale(1,1)', opacity: 1 }], { duration: 900, delay: dl, easing: 'cubic-bezier(.3,1.15,.4,1)', fill: 'backwards' });
      maxEnd = Math.max(maxEnd, dl + 900);
      if (!isC) {
        const g = o.cloneNode(true); g.removeAttribute('data-vt');
        g.style.cssText = `position:fixed;left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;right:auto;bottom:auto;margin:0;transform-origin:0 0;z-index:4;pointer-events:none;visibility:visible`;
        ghosts.appendChild(g); g.querySelectorAll('svg').forEach(s => { try { s.pauseAnimations(); } catch (e) { } });
        g.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${-dx * .5}px,${-dy * .5 + lift}px) scale(${(1 + 1 / sx) / 2},${(1 + 1 / sy) / 2}) rotate(${tilt}deg)`, opacity: .6, offset: .4 }, { transform: `translate(${-dx}px,${-dy}px) scale(${1 / sx},${1 / sy})`, opacity: 0 }], { duration: 900, delay: dl, easing: 'cubic-bezier(.3,1.15,.4,1)', fill: 'both' }).onfinish = () => g.remove();
      }
    } else {
      const d = 220 + (ei++) * 70;
      e.animate(enterKf(ENTER[n], dir, ei), { duration: 700, delay: d, easing: 'cubic-bezier(.2,.9,.3,1.12)', fill: 'backwards' });
      maxEnd = Math.max(maxEnd, d + 700);
    }
  });
  if (old) {
    old.querySelectorAll('.pop').forEach((e, i) => {
      if (e.style.visibility === 'hidden') return;
      e.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `perspective(1000px) translate3d(${-dir * 60}px,-10px,-160px) rotateY(${dir * 28}deg) scale(.9)` }], { duration: 380, delay: i * 18, easing: 'ease-in', fill: 'forwards' });
    });
    old.querySelector('.say').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    setTimeout(() => { old.classList.remove('on'); smil(old, false); old.getAnimations({ subtree: true }).forEach(a => a.cancel()); old.querySelectorAll('[data-vt]').forEach(e => e.style.visibility = ''); }, 860);
  }
  document.getElementById('slides').animate([{ transform: `perspective(1400px) rotateY(${dir * -4}deg) scale(.97)` }, { transform: 'none' }], { duration: 700, easing: 'cubic-bezier(.2,.9,.3,1)' });
  cur = n;
  dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i === n));
  cnt.textContent = (n + 1) + ' / ' + N; prev.disabled = n === 0; next.disabled = n === N - 1;
  if (n === N - 1) setTimeout(burst, 600);
  setTimeout(() => { busy = false; if (queued !== null) { const q = queued; queued = null; go(q); } }, Math.min(maxEnd, 1000));
}
function go(n) { n = Math.max(0, Math.min(N - 1, n)); if (n === cur) return; if (busy) { queued = n; return; } show(n); }
function layoutMM(sl) {
  const mm = sl.querySelector('.mm'); if (!mm) return;
  const cc = mm.querySelector('.mm-c'), svg = mm.querySelector('.lines'), W = mm.offsetWidth, H = mm.offsetHeight;
  if (!W) return; svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'none');
  const cx = W / 2, cy = H / 2;
  svg.innerHTML = [...mm.querySelectorAll('.mm-n')].map(n => { const x = n.offsetLeft + n.offsetWidth / 2, y = n.offsetTop + n.offsetHeight / 2; return `<path pathLength="1" d="M${cx} ${cy} Q${(cx + x) / 2} ${cy - (y > cy ? -30 : 30)} ${x} ${y}"/>`; }).join('');
}
function burst() {
  const cols = ['#ffd23f', '#ff6b5e', '#9be8d0', '#ffb3c7', '#fff'], st = document.querySelector('.stage');
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('i'); d.style.cssText = `position:absolute;z-index:20;left:${50 + (Math.random() - .5) * 20}%;top:45%;width:${6 + Math.random() * 8}px;height:${8 + Math.random() * 8}px;background:${cols[i % 5]};border:1.5px solid #0e2f4f;border-radius:${i % 3 ? 2 : 50}%;pointer-events:none`;
    st.appendChild(d); const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
    d.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v - 120}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .45 }, { transform: `translate(${Math.cos(a) * v * 1.2}px,${Math.sin(a) * v + 360}px) rotate(900deg)`, opacity: 0 }], { duration: 1800 + Math.random() * 800, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => d.remove();
  }
}
/* kontrol */
next.onclick = () => go(cur + 1); prev.onclick = () => go(cur - 1);
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(+g.dataset.go); if (e.target.closest('[data-next]')) go(cur + 1); });
addEventListener('keydown', e => { if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); } else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) go(cur - 1); else if (e.key === 'f' || e.key === 'F') fs(); else if (e.key === 'Home') go(0); else if (e.key === 'End') go(N - 1); });
let tx = 0, ty = 0; addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
let wt = 0; addEventListener('wheel', e => { const t = Date.now(); if (t - wt < 900 || Math.abs(e.deltaY) < 20) return; wt = t; go(cur + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
function fs() { const d = document, el = d.documentElement; try { d.fullscreenElement ? d.exitFullscreen() : el.requestFullscreen(); } catch (e) { } }
document.querySelector('.fs').onclick = fs;
addEventListener('resize', () => { layoutMM(slides[cur]); });
/* gelembung */
const stg = document.querySelector('.stage');
for (let i = 0; i < 14; i++) { const b = document.createElement('i'); b.className = 'bub'; const s = 8 + Math.random() * 22; b.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 14}s`; stg.querySelector('.rays').appendChild(b); }
show(0); setTimeout(() => layoutMM(slides[cur]), 300);

function splash() {
  const w = document.querySelector('.waves'), ry = document.querySelector('.rays');
  w.animate([{ transform: 'none', transformOrigin: '50% 100%' }, { transform: 'translateY(-14%)', transformOrigin: '50% 100%', offset: .4 }, { transform: 'none', transformOrigin: '50% 100%' }], { duration: 1100, easing: 'ease-in-out' });
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('i'), s = 6 + Math.random() * 16; b.className = 'bub'; b.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;animation:none;bottom:-10px`;
    ry.appendChild(b); b.animate([{ transform: 'translateY(0) scale(.6)', opacity: 0 }, { opacity: 1, offset: .2 }, { transform: `translateY(-${30 + Math.random() * 45}vh) translateX(${Math.random() * 40 - 20}px) scale(1.1)`, opacity: 0 }], { duration: 1300 + Math.random() * 900, delay: Math.random() * 300, easing: 'ease-out' }).onfinish = () => b.remove();
  }
}
if (matchMedia('(min-width:900px) and (pointer:fine)').matches) addEventListener('pointermove', e => {
  const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
  document.getElementById('slides').style.transform = `perspective(1400px) rotateY(${x * 4}deg) rotateX(${-y * 3}deg)`;
  document.querySelectorAll('.deco').forEach((d, i) => d.firstChild.style.translate = `${-x * (14 + i * 6)}px ${-y * (10 + i * 4)}px`);
});
document.addEventListener('click', e => { const c = e.target.closest('.cch'); if (c) c.animate([{ transform: 'none' }, { transform: 'translateY(-34px) scale(.95,1.08)', offset: .4 }, { transform: 'translateY(0) scale(1.08,.92)', offset: .7 }, { transform: 'none' }], { duration: 650, easing: 'ease-out' }); });
</script></body></html>
