<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Harian Olahraga — Tugas Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--paper:#bcbcbc;--mid:#454545;--red:#b3261e;--b:.15s;
  --hd:'Playfair Display','Times New Roman',serif;--bd:'Libre Baskerville',Georgia,serif}
html,body{height:100%;overflow:hidden;background:#7d7d7d;font-family:var(--bd);color:var(--ink)}
@media(min-width:900px){html{font-size:clamp(16px,min(1.5vw,2.3vh),34px)}.photo.tall{aspect-ratio:4/5;height:40vh;width:auto;margin-inline:auto}.photo svg{max-height:38vh}.barw{height:clamp(110px,30vh,320px)}.dot{width:.6rem;height:.6rem}.dot.on{width:1.3rem}}
.stage{position:relative;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#cacaca,#b3b3b3 75%)}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(circle,rgba(0,0,0,.09) .8px,transparent 1.2px) 0 0/4px 4px,repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 80px rgba(0,0,0,.28)}
.top{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.5rem;
  padding:.4rem 1rem;border-bottom:1px solid var(--ink);background:var(--paper);font:italic .68rem var(--bd)}
.top .dt{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{font:700 .64rem var(--hd);letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--ink);padding:.2rem .55rem;cursor:pointer;color:var(--ink)}
.top button:hover{background:var(--ink);color:var(--paper)}
.ticker{position:absolute;left:0;right:0;bottom:3rem;height:1.5rem;z-index:50;display:flex;align-items:center;background:var(--ink);color:#e4e4e4;overflow:hidden;
  font:700 .64rem var(--hd);letter-spacing:.1em;text-transform:uppercase}
.ticker b{background:var(--red);color:#fff;padding:0 .7rem;height:100%;display:flex;align-items:center;z-index:2;flex:none}
.ticker div{white-space:nowrap;animation:tick 40s linear infinite;padding-left:1rem}
@keyframes tick{to{transform:translateX(-50%)}}
.nav{position:absolute;left:0;right:0;bottom:0;height:3rem;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:0 1rem;background:var(--paper);border-top:4px double var(--ink)}
.btn{font:700 .72rem var(--hd);letter-spacing:.1em;text-transform:uppercase;padding:.45rem .9rem;border:1.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.3;cursor:default}
.btn-next{background:var(--ink);color:#eee}
.btn-next:hover:not(:disabled){background:var(--red);border-color:var(--red);color:#fff}
.dots{display:flex;gap:5px;flex:1;justify-content:center;align-items:center}
.dot{width:8px;height:8px;border:1px solid var(--ink);background:none;cursor:pointer;padding:0;transition:width .25s,background .25s}
.dot.on{background:var(--ink);width:18px}

.slide{position:absolute;inset:0;display:flex;overflow-y:auto;padding:2.9rem 1rem 5.2rem;opacity:0;visibility:hidden;pointer-events:none;z-index:4}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;z-index:5}
.slide.leaving{visibility:visible;opacity:1;z-index:4;pointer-events:none}
.wrap{width:100%;max-width:66rem;margin:auto}
.center{text-align:center}

.rule{border-top:1.5px solid var(--ink);margin:.45rem 0}
.rule.dbl{border-top:4px double var(--ink)}
.big{font:900 clamp(2.2rem,10vw,6rem)/.95 var(--hd);text-transform:uppercase;text-align:center;margin:.35rem 0;color:#262626;text-shadow:3px 3px 0 #8d8d8d}
.blackbar{background:var(--ink);color:#dcdcdc;display:flex;justify-content:space-between;gap:.5rem;padding:.25rem .8rem;font:italic .68rem var(--bd);margin:.3rem 0}
.navline{text-align:center;font:700 .6rem var(--hd);letter-spacing:.14em;text-transform:uppercase;padding:.4rem 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.subt{display:flex;align-items:center;gap:.8rem;margin:.6rem 0}
.subt i{flex:1;border-top:1.5px solid var(--ink)}
.subt span{font:400 clamp(.85rem,2.4vw,1.2rem) var(--hd);letter-spacing:.06em;text-transform:uppercase}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:.2rem 0 .8rem}
.hl{font:800 clamp(1.3rem,4.6vw,2.4rem)/1.05 var(--hd);text-transform:uppercase}
.sec{font:italic .68rem var(--bd);color:var(--mid);white-space:nowrap}
.body{font-size:clamp(.74rem,1.9vw,.95rem);line-height:1.55;text-align:justify;hyphens:auto}
.dropcap::first-letter{font:900 3.1em/.8 var(--hd);float:left;padding:.06em .08em 0 0}
.quote{font:italic 400 clamp(.95rem,2.6vw,1.35rem)/1.45 var(--hd);text-align:justify}
.quote::first-letter{font:900 2.6em/.8 var(--hd);float:left;padding:.05em .08em 0 0;font-style:normal}

.photo{position:relative;border:1px solid var(--ink);background:radial-gradient(circle,rgba(0,0,0,.28) .8px,transparent 1.2px) 0 0/4px 4px,#d9d9d9;overflow:hidden;display:block;margin:0}
.photo svg{display:block;width:100%;height:auto;max-height:34vh}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15)}
.photo.tall{aspect-ratio:4/5}
.photo.tall svg{height:100%;max-height:none}
.photo.sm{width:3.4rem;flex:none;aspect-ratio:1}
.photo.sm svg{max-height:none;height:100%}
.cap{font:700 .78rem var(--hd);text-align:center;margin-top:.35rem}
.cap small{display:block;font:400 .64rem var(--bd);color:var(--mid);margin-top:.1rem}
.tag{font:700 .55rem var(--hd);letter-spacing:.12em;text-transform:uppercase;color:var(--red);text-align:center;margin-top:.3rem}

.g2{display:grid;grid-template-columns:1fr 1.3fr;gap:1.1rem;align-items:start}
.vr{border-left:1px solid var(--ink);padding-left:1.1rem}
@media(max-width:640px){.g2{grid-template-columns:1fr}.vr{border-left:0;padding-left:0;border-top:1px solid var(--ink);padding-top:.7rem}}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.toc{display:grid;grid-template-columns:repeat(2,1fr);gap:.1rem 2rem}
.toc-row{display:flex;align-items:baseline;gap:.5rem;padding:.55rem .3rem;background:none;border:0;border-bottom:1px solid rgba(0,0,0,.5);font:400 .9rem var(--hd);cursor:pointer;text-align:left;color:var(--ink);transition:background .2s,color .2s}
.toc-row .no{font:900 1.3rem var(--hd)}
.toc-row i{flex:1;border-bottom:2px dotted var(--ink);transform:translateY(-.25em)}
.toc-row span:last-child{font:italic .7rem var(--bd)}
.toc-row:hover{background:var(--ink);color:var(--paper)}
.toc-row:hover i{border-color:var(--paper)}
@media(max-width:640px){.toc{grid-template-columns:1fr}}
.goals{list-style:none;display:flex;flex-direction:column}
.goals li{display:flex;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--ink);font-size:clamp(.8rem,2vw,1rem);line-height:1.35}
.goals b{font:900 2.2rem/1 var(--hd);width:2rem;text-align:center;flex:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:.9rem;max-width:520px;margin-left:auto;margin-right:auto}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:.8rem}
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.barw{height:clamp(110px,27vh,230px);display:flex;align-items:flex-end;border-bottom:3px solid var(--ink)}
.bar{width:min(62%,46px);margin:0 auto;background:var(--ink);position:relative;border-radius:50% 50% 0 0/9px 9px 0 0}
.bar::before{content:'';position:absolute;top:0;left:0;right:0;height:26%;background:#6a6a6a;border-radius:inherit}
.chart .cap{font-size:.74rem}
.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:.2rem 1.6rem}
.tip{display:flex;gap:.8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--ink);font-size:clamp(.78rem,1.9vw,.95rem);line-height:1.35}
@media(max-width:640px){.tips{grid-template-columns:1fr}}
.steps{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-top:1rem}
.steps>div{flex:1;max-width:190px}
.arr{font-size:1.6rem;animation:arrow 1.2s ease-in-out infinite}
@keyframes arrow{50%{transform:translateX(6px)}}
.stamp{display:inline-block;margin:1rem auto;border:4px solid var(--red);color:var(--red);font:900 1.4rem var(--hd);letter-spacing:.2em;padding:.25rem 1rem;transform:rotate(-12deg)}
.note{margin-top:1rem;border:1px solid var(--ink);padding:.4rem .7rem;font:italic .72rem var(--bd);background:rgba(255,255,255,.18)}
.note b{font:700 .6rem var(--hd);letter-spacing:.12em;text-transform:uppercase;margin-right:.5rem;font-style:normal}

/* animasi masuk untuk elemen yang TIDAK punya pasangan morph */
.slide.active .rv{animation:var(--a,ink) .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--b) + var(--n,0)*.1s)}
@keyframes ink{from{opacity:0;filter:blur(7px);transform:translateY(10px) scale(1.04)}}
@keyframes rule{from{transform:scaleX(0)}}
@keyframes photo{from{clip-path:inset(0 0 100% 0);filter:blur(5px)}}
@keyframes bar{from{transform:scaleY(0)}}
@keyframes press{from{opacity:0;transform:scale(1.9);filter:blur(10px)}}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(3)}60%{opacity:1;transform:rotate(-12deg) scale(.9)}100%{transform:rotate(-12deg) scale(1)}}
.rv-rule{--a:rule;transform-origin:left}
.rv-photo{--a:photo}
.rv-bar{--a:bar;transform-origin:bottom}
.rv-stamp{--a:stamp}
.lt{display:inline-block}
.slide.active .lt{animation:press .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--b) + var(--i)*.055s)}
/* elemen yang sedang di-morph: matikan animasi masuk biasa */
.slide .mo,.slide .mo .lt{animation:none!important}

.f-run{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.f-spin{transform-origin:50px 50px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.f-wave{animation:wave 1.6s linear infinite}
@keyframes wave{to{transform:translateX(-50px)}}
.speed{animation:speed .7s linear infinite}
@keyframes speed{from{transform:translateX(14px);opacity:0}40%{opacity:1}to{transform:translateX(-14px);opacity:0}}
.flag{animation:flag 1.2s ease-in-out infinite alternate;transform-origin:60px 14px}
@keyframes flag{to{transform:skewY(-12deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top">
    <span><button onclick="go(2)">☰ Daftar Isi</button> <button onclick="fsToggle()">⛶ Layar Penuh (F)</button></span>
    <span class="dt" id="date"></span>
    <span>Hal. <b id="cur">1</b>/<span id="tot">11</span></span>
  </div>
  <div id="slides-root"></div>
  <div class="ticker"><b>Terkini</b><div id="tk"></div></div>
  <div class="nav">
    <button class="btn" id="prev" onclick="goDir(-1)">‹ Kembali</button>
    <div class="dots" id="dots"></div>
    <button class="btn btn-next" id="next" onclick="goDir(1)">Lanjut ›</button>
  </div>
</div>

<script>
const DATA = {
  tema: "OLAHRAGA",
  kelompok: "KELOMPOK 1",
  judul: "TUGAS\nSEKOLAH",
  anggota: [
    { nama: "Nama Kamu",    jabatan: "Ketua",     deskripsi: "Pembawa materi", foto: "" },
    { nama: "Nama Teman 1", jabatan: "Moderator", deskripsi: "Pengarah",       foto: "" },
    { nama: "Nama Teman 2", jabatan: "Notulen",   deskripsi: "Pencatat",       foto: "" }
  ],
  daftarIsi: [
    { no: "01", label: "Latar Belakang", slide: 3 },
    { no: "02", label: "Tujuan",         slide: 4 },
    { no: "03", label: "Pengertian",     slide: 5 },
    { no: "04", label: "Jenis-Jenis",    slide: 6 },
    { no: "05", label: "Manfaat",        slide: 7 },
    { no: "06", label: "Cedera",         slide: 8 },
    { no: "07", label: "Kesimpulan",     slide: 9 },
    { no: "08", label: "Penutup",        slide: 10 }
  ],
  tujuan: [
    "Mengetahui pengertian olahraga",
    "Mengetahui jenis-jenis olahraga",
    "Mengetahui manfaat olahraga bagi tubuh dan mental",
    "Mengetahui cara mencegah cedera saat berolahraga"
  ],
  latarBelakang: [
    "Olahraga penting dilakukan sejak dini untuk menjaga kesehatan tubuh dan meningkatkan kebugaran jasmani sehari-hari.",
    "Dengan berolahraga secara teratur, tubuh menjadi lebih kuat, mental lebih stabil, dan risiko penyakit menurun."
  ],
  pengertian: "Olahraga adalah aktivitas fisik yang dilakukan secara terencana dan berulang untuk menjaga kesehatan, meningkatkan kebugaran tubuh, serta melatih keterampilan gerak.",
  jenis: [
    { judul: "Permainan Bola",    contoh: "sepak bola · basket · voli",  grup: "Beregu" },
    { judul: "Atletik",           contoh: "lari · lompat · tolak",       grup: "Perorangan" },
    { judul: "Bela Diri",         contoh: "silat · karate · taekwondo",  grup: "Perorangan" },
    { judul: "Renang",            contoh: "gaya bebas · dada",           grup: "Perorangan" },
    { judul: "Senam & Kebugaran", contoh: "senam · yoga · sepeda",       grup: "Perorangan" }
  ],
  manfaat: [
    { no: 1, judul: "Jantung Sehat", desc: "Melatih jantung & paru-paru" },
    { no: 2, judul: "Otot Kuat",     desc: "Membangun kekuatan tubuh" },
    { no: 3, judul: "Daya Tahan",    desc: "Stamina lebih baik" },
    { no: 4, judul: "Mental Baik",   desc: "Kurangi stres & cemas" },
    { no: 5, judul: "Sportivitas",   desc: "Melatih kerja sama & fair play" }
  ],
  cedera: [
    { teks: "Keseleo & kram — pemanasan dulu" },
    { teks: "Gunakan sepatu & alat yang sesuai" },
    { teks: "Jaga teknik gerakan yang benar" },
    { teks: "Minum air cukup (hidrasi)" },
    { teks: "Berhenti jika sakit atau sangat lelah" }
  ],
  kesimpulan: "Olahraga sangat penting untuk kesehatan tubuh dan mental. Lakukan secara teratur dengan urutan: pemanasan → kegiatan inti → pendinginan. Jaga keselamatan, minum cukup, dan istirahat yang cukup agar tubuh tetap bugar.",
  penutup: "Ada Pertanyaan?"
};

const NOTES = [
  "",
  "Halo! Kami Kelompok 1 akan menjelaskan tentang olahraga.",
  "Ini daftar materinya. Klik salah satu baris untuk langsung loncat!",
  "Olahraga bikin badan sehat dan bugar setiap hari!",
  "Ada 4 hal yang akan kita pelajari hari ini.",
  "Olahraga = gerak tubuh yang terencana dan berulang.",
  "Ada olahraga beregu dan perorangan, lho!",
  "Rutin olahraga: jantung, otot, dan mental ikut kuat!",
  "Pemanasan dulu ya, biar tidak cedera!",
  "Ingat urutannya: pemanasan, inti, pendinginan.",
  "Terima kasih! Ada pertanyaan?"
];

const K = 'stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"';
const GROUND = '<path d="M8 93H94" stroke="#111" stroke-width="3"/>';
const RUN_IN = `<g class="f-run"><circle cx="60" cy="20" r="9" fill="#111"/><g ${K}><path d="M57 32L48 58"/><path d="M56 37L72 47L82 41"/><path d="M56 37L42 45L34 57"/><path d="M48 58L64 70L60 89"/><path d="M48 58L36 75L20 77"/></g></g>`;
const ILL = {
  hero: `<svg viewBox="0 0 160 100"><defs><pattern id="hd" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#111"/></pattern></defs><circle cx="118" cy="32" r="24" fill="url(#hd)" stroke="#111" stroke-width="2"/><g class="speed" stroke="#111" stroke-width="3" stroke-linecap="round"><path d="M14 40H44"/><path d="M8 56H36"/><path d="M18 72H46"/></g><g transform="translate(34 -2)">${RUN_IN}</g><path d="M0 92H160" stroke="#111" stroke-width="4"/></svg>`,
  run: `<svg viewBox="0 0 100 100">${RUN_IN}${GROUND}</svg>`,
  ball: `<svg viewBox="0 0 100 100"><g class="f-spin"><circle cx="50" cy="50" r="32" fill="#eee" stroke="#111" stroke-width="4"/><polygon points="50,36 63,45 58,60 42,60 37,45" fill="#111"/><path d="M50 36V19M63 45L80 39M58 60L69 76M42 60L31 76M37 45L20 39" stroke="#111" stroke-width="4" stroke-linecap="round"/></g></svg>`,
  kick: `<svg viewBox="0 0 100 100"><g class="f-run"><circle cx="38" cy="20" r="9" fill="#111"/><g ${K}><path d="M40 32L42 58"/><path d="M40 38L60 34"/><path d="M40 38L24 46"/><path d="M42 58L82 50"/><path d="M42 58L36 88"/></g></g>${GROUND}</svg>`,
  swim: `<svg viewBox="0 0 100 100"><circle cx="28" cy="46" r="8" fill="#111"/><g ${K}><path d="M36 54L70 56"/><path d="M34 50Q42 24 62 34"/><path d="M72 56L88 50"/></g><g class="f-wave"><path d="M-50 64q12.5 -8 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0" stroke="#111" stroke-width="4" fill="none"/><path d="M-50 78q12.5 -8 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0" stroke="#555" stroke-width="4" fill="none"/></g></svg>`,
  senam: `<svg viewBox="0 0 100 100"><g class="f-run"><circle cx="50" cy="20" r="9" fill="#111"/><g ${K}><path d="M50 32V58"/><path d="M50 36L28 14"/><path d="M50 36L72 14"/><path d="M50 58L32 88"/><path d="M50 58L68 88"/></g></g></svg>`,
  stadium: `<svg viewBox="0 0 120 90"><path d="M10 82V30M110 82V30" stroke="#111" stroke-width="4"/><rect x="2" y="18" width="16" height="11" fill="#111"/><rect x="102" y="18" width="16" height="11" fill="#111"/><path d="M18 80V46Q60 16 102 46V80Z" fill="#eee" stroke="#111" stroke-width="3"/><path d="M18 56H102M18 66H102" stroke="#111" stroke-width="2"/><g fill="#111"><rect x="30" y="58" width="9" height="22"/><rect x="48" y="58" width="9" height="22"/><rect x="66" y="58" width="9" height="22"/><rect x="84" y="58" width="9" height="22"/></g><path d="M60 30V8" stroke="#111" stroke-width="3"/><path class="flag" d="M60 8L82 14L60 20Z" fill="#111"/></svg>`,
  person: `<svg viewBox="0 0 100 120"><circle cx="50" cy="42" r="20" fill="#111"/><path d="M10 120Q12 78 50 76Q88 78 90 120Z" fill="#111"/></svg>`,
  trophy: `<svg viewBox="0 0 100 100"><path d="M28 16H72V40Q72 62 50 66Q28 62 28 40Z" fill="#111"/><path d="M28 22Q10 22 12 40Q14 50 30 50M72 22Q90 22 88 40Q86 50 70 50" stroke="#111" stroke-width="5" fill="none"/><rect x="44" y="66" width="12" height="12" fill="#111"/><rect x="32" y="78" width="36" height="9" fill="#111"/></svg>`,
  shoe: `<svg viewBox="0 0 100 100"><path d="M12 62V38Q36 42 44 24L56 42Q82 44 90 62V70H12Z" fill="#eee" stroke="#111" stroke-width="4" stroke-linejoin="round"/><rect x="12" y="68" width="78" height="10" fill="#111"/><path d="M40 34L46 44M48 30L54 40" stroke="#111" stroke-width="3"/></svg>`,
  plester: `<svg viewBox="0 0 100 100"><g transform="rotate(-35 50 50)"><rect x="10" y="36" width="80" height="28" rx="14" fill="#eee" stroke="#111" stroke-width="4"/><rect x="38" y="36" width="24" height="28" fill="#999" stroke="#111" stroke-width="3"/></g></svg>`,
  check: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="#eee" stroke="#111" stroke-width="5"/><path d="M32 52L45 65L70 36" stroke="#111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`,
  bottle: `<svg viewBox="0 0 100 100"><rect x="40" y="8" width="20" height="12" fill="#111"/><path d="M34 28Q34 20 42 20H58Q66 20 66 28V88H34Z" fill="#eee" stroke="#111" stroke-width="4"/><path d="M34 54Q42 48 50 54T66 54V88H34Z" fill="#777"/></svg>`,
  stop: `<svg viewBox="0 0 100 100"><polygon points="32,8 68,8 92,32 92,68 68,92 32,92 8,68 8,32" fill="#111"/><text x="50" y="58" text-anchor="middle" font-size="22" font-weight="900" fill="#eee" font-family="Playfair Display,serif">STOP</text></svg>`
};
const JI = ['ball', 'run', 'kick', 'swim', 'senam'];
const CI = ['plester', 'shoe', 'check', 'bottle', 'stop'];

const R = (n, c = '', x = '') => `class="rv ${c}" style="--n:${n};${x}"`;
let li = 0;
const letters = t => { li = 0; return [...t].map(ch => ch === ' ' ? ' ' : `<span class="lt" style="--i:${li++}">${ch}</span>`).join(''); };

const note = n => NOTES[n] ? `<div ${R(11, 'note')}><b>Catatan Redaksi</b>${NOTES[n]}</div>` : '';
const slide = (k, inner) => `<section class="slide${k === 0 ? ' active' : ''}" data-i="${k}"><div class="wrap">${inner}${note(k)}</div></section>`;

/* =========================================================
   TRANSISI MORPH (ala PowerPoint)
   Elemen sejenis di slide lama & baru dipasangkan berdasarkan
   urutan, lalu "terbang" dari posisi/ukuran lama ke yang baru.
   Elemen tanpa pasangan muncul dengan animasi tinta.
   Jenis: t = text (skala ikut ukuran font), box (skala ikut kotak), move (geser saja)
   f = 1 → ikut cross-fade, f = 0 → bentuk sama persis (tanpa fade)
   ========================================================= */
const CATS = [
  ['.rule', 'box', 0],
  ['.big', 'text', 1],
  ['.hl', 'text', 1],
  ['.sec', 'text', 1],
  ['.blackbar,.subt', 'box', 0],
  ['.photo:not(.sm)', 'box', 1],
  ['.cap', 'text', 1],
  ['.tag', 'text', 1],
  ['.body,.quote', 'text', 1],
  ['.toc-row,.goals li,.tip', 'move', 1],
  ['.bar', 'box', 0],
  ['.note', 'move', 1]
];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fs = e => parseFloat(getComputedStyle(e).fontSize) || 16;

let slides = [], i = 0, busy = false, queued = null;
const total = 11;

function ui() {
  document.getElementById('cur').textContent = i + 1;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === total - 1 ? 'Selesai ✓' : 'Lanjut ›';
  const el = document.getElementById('dots'); el.innerHTML = '';
  for (let n = 0; n < total; n++) {
    const b = document.createElement('button');
    b.className = 'dot' + (n === i ? ' on' : '');
    b.onclick = () => go(n);
    el.appendChild(b);
  }
}
function swap(n) { slides.forEach((s, k) => s.classList.toggle('active', k === n)); i = n; ui(); }

function go(n) {
  if (n < 0 || n >= total || n === i) return;
  if (busy) { queued = n; return; }
  const old = slides[i], nw = slides[n];
  if (!old.animate || matchMedia('(prefers-reduced-motion:reduce)').matches) { swap(n); return; }
  busy = true;
  nw.scrollTop = 0;

  /* 1. ukur posisi lama & baru, lalu pasangkan */
  const pairs = [];
  CATS.forEach(([sel, type, fade]) => {
    const A = [...old.querySelectorAll(sel)], B = [...nw.querySelectorAll(sel)];
    for (let j = 0; j < Math.min(A.length, B.length); j++) {
      const ra = A[j].getBoundingClientRect(), rb = B[j].getBoundingClientRect();
      if (!rb.width || !ra.width) continue;
      let sx = 1, sy = 1;
      if (type === 'text') sx = sy = clamp(fs(A[j]) / fs(B[j]), .3, 4);
      else if (type === 'box') { sx = clamp(ra.width / rb.width, .05, 12); sy = clamp(ra.height / Math.max(rb.height, 1), .05, 12); }
      pairs.push({ a: A[j], b: B[j], dx: ra.left - rb.left, dy: ra.top - rb.top, sx, sy, fade });
    }
  });

  /* 2. siapkan: matikan animasi masuk untuk yang di-morph */
  document.documentElement.style.setProperty('--b', '.5s');
  old.classList.add('leaving');
  pairs.forEach(p => { p.b.classList.add('mo'); if (!p.fade) p.a.style.visibility = 'hidden'; });
  swap(n);

  /* 3. jalankan morph */
  const D = 850;
  pairs.forEach(p => {
    p.b.style.transformOrigin = '0 0';
    const from = `translate(${p.dx}px,${p.dy}px) scale(${p.sx},${p.sy})`;
    p.b.animate([
      { transform: from, opacity: p.fade ? 0 : 1 },
      { opacity: 1, offset: .5 },
      { transform: 'none', opacity: 1 }
    ], { duration: D, easing: 'cubic-bezier(.65,0,.25,1)', fill: 'backwards' })
      .onfinish = () => { p.b.style.transformOrigin = ''; };
  });
  const fo = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'ease-in', fill: 'forwards' });

  setTimeout(() => {
    fo.cancel();
    old.classList.remove('leaving');
    pairs.forEach(p => { p.a.style.visibility = ''; p.a.classList.remove('mo'); });
    old.querySelectorAll('.mo').forEach(e => e.classList.remove('mo'));
    busy = false;
    if (queued !== null) { const q = queued; queued = null; go(q); }
  }, D + 80);
}
function goDir(d) { go((queued !== null ? queued : i) + d); }

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goDir(1); }
  else if (e.key === 'ArrowLeft') goDir(-1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(total - 1);
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.();
  }
});
function fsToggle() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
let tx = 0;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - tx;
  if (Math.abs(dx) > 60) goDir(dx < 0 ? 1 : -1);
}, { passive: true });
let wheelAt = 0;
stage.addEventListener('wheel', e => {
  const now = Date.now();
  if (now - wheelAt < 1200 || Math.abs(e.deltaY) < 40) return;
  const s = e.target.closest('.slide');
  if (s && s.scrollHeight > s.clientHeight + 4) return;
  wheelAt = now; goDir(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

renderSlides();
slides = [...document.querySelectorAll('.slide')];
const today = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
document.getElementById('date').textContent = 'Harian Olahraga · ' + today;
document.querySelectorAll('.today').forEach(e => e.textContent = today);
const tk = ['Olahraga menjaga kesehatan tubuh dan mental', ...DATA.tujuan, 'Urutan aman: pemanasan → kegiatan inti → pendinginan', 'Minum air cukup dan istirahat yang cukup'].join('  ◆  ');
document.getElementById('tk').textContent = tk + '  ◆  ' + tk + '  ◆  ';
document.getElementById('tot').textContent = total;
ui();
</script>
</body>
