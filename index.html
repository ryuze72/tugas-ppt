<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olahraga Renang</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#0e2f4f;--coral:#ff6b5e;--sun:#ffd23f;--aqua:#27c4e8;--teal:#14a39a;--cream:#fffdf5;--mint:#9be8d0;--pink:#ffb3c7;--sky:#a8dcff;--peach:#ffc98a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a5f94;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink)}

/* ===== LATAR (memenuhi layar) ===== */
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#5fd8f5 0%,#23b5e0 45%,#0a5f94 100%);--w1:#1b9ed0;--w2:#0a6f9a}
.bgl{position:absolute;inset:0;transition:opacity 1.5s ease;opacity:0}
.rays{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rays i.ray{position:absolute;top:-10%;width:20%;height:130%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transform:skewX(-18deg);animation:ray 9s ease-in-out infinite alternate}
.rays i.ray:nth-child(1){left:6%}.rays i.ray:nth-child(2){left:40%;width:12%;animation-delay:-3s}.rays i.ray:nth-child(3){left:72%;animation-delay:-6s}
@keyframes ray{from{opacity:.25;transform:skewX(-18deg) translateX(-14px)}to{opacity:.8;transform:skewX(-18deg) translateX(22px)}}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(18px)}}
.waves{position:absolute;left:0;bottom:0;width:100%;height:16%;pointer-events:none;overflow:hidden}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 9s linear infinite}
.waves svg.b{animation-duration:14s;animation-direction:reverse;bottom:-6px;opacity:.8}
.waves path{transition:fill 1.5s}
@keyframes wv{to{transform:translateX(-50%)}}

/* ===== PANGGUNG 16:9 (1280x720, diskalakan otomatis) ===== */
#deck{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%}
.deco{position:absolute;z-index:1;pointer-events:none;transition:left 1.1s cubic-bezier(.45,0,.15,1),top 1.1s cubic-bezier(.45,0,.15,1),transform 1.1s cubic-bezier(.45,0,.15,1)}
.deco .in{width:100%;height:100%;animation:fl 5s ease-in-out infinite alternate}
.deco svg{width:100%;height:100%;overflow:visible}
@keyframes fl{from{transform:translateY(-6px) rotate(-3deg)}to{transform:translateY(8px) rotate(3deg)}}
#sun{width:112px;height:112px}#c1{width:156px;height:82px}#c2{width:116px;height:60px}#ball{width:74px;height:74px}#shell{width:64px;height:64px}
#sun .in{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

#slides{position:absolute;inset:0;z-index:2}
.slide{position:absolute;inset:0;display:none;padding:26px 56px 168px}
.slide.on{display:block}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}

/* judul & teks */
.ttl{display:inline-block;position:relative;background:var(--sun);border:4px solid var(--ink);border-radius:36px 40px 34px 42px/40px 34px 42px 36px;box-shadow:5px 7px 0 var(--ink);padding:8px 34px 10px;font-family:Fredoka,sans-serif;font-weight:700;font-size:44px;line-height:1.15;text-align:center;color:var(--ink);white-space:nowrap}
.ttl .l{display:inline-block}
.ttl small{display:block;font-size:20px;font-weight:600;opacity:.75;margin-top:1px}
.ttl.big{background:transparent;border:none;box-shadow:none;color:#fff;font-size:104px;line-height:1.02;-webkit-text-stroke:12px var(--ink);paint-order:stroke fill;text-shadow:0 9px 0 var(--ink);letter-spacing:2px;padding:0}
.ttl.big span{display:inline-block;animation:lw 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
@keyframes lw{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.1em) rotate(-3deg)}}
.sub{font-family:Fredoka,sans-serif;font-weight:600;font-size:24px;background:var(--cream);border:3px solid var(--ink);border-radius:26px;padding:6px 22px;box-shadow:4px 4px 0 var(--ink);text-align:center}
.intro{font-weight:700;font-size:22px;text-align:center;color:#fff;text-shadow:0 2px 0 rgba(14,47,79,.55);max-width:900px}

/* kolam */
.pool{position:relative;width:100%;aspect-ratio:2/1;border:4px solid var(--ink);border-radius:34px 38px 32px 40px/38px 32px 40px 34px;box-shadow:6px 8px 0 var(--ink);overflow:hidden;background:linear-gradient(180deg,#e9fbff 0%,#bdeeff 42%,#52c6ee 100%)}
.pool svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:12px;left:14px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:2px 14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;z-index:3;box-shadow:2px 3px 0 var(--ink)}

/* kartu */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:22px;width:100%;max-width:1168px;--ic:124px}
.cards.n5{--ic:92px;gap:16px}
.card{position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:28px 32px 26px 34px/32px 26px 34px 28px;box-shadow:5px 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 14px 20px}
.card .ic{width:var(--ic);height:var(--ic);flex:none;background:var(--c,var(--sky));border:3.5px solid var(--ink);border-radius:50%;overflow:hidden;display:grid;place-items:center}
.card .ic svg{width:100%;height:100%;overflow:visible}
.card .ic.sq svg{transform:scale(1.15)}
.card h3{font-family:Fredoka,sans-serif;font-weight:700;font-size:25px;line-height:1.1;margin-bottom:3px}
.card p{font-size:17px;line-height:1.3;font-weight:600;opacity:.9}
.cards.n5 .card h3{font-size:20px}.cards.n5 .card p{font-size:15px;line-height:1.28}
.card .no{position:absolute;top:-14px;right:14px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:14px;font-family:Fredoka,sans-serif;font-weight:700;font-size:16px;padding:0 10px}
.txtcard{background:var(--cream);border:4px solid var(--ink);border-radius:30px 34px 28px 36px/34px 28px 36px 30px;box-shadow:6px 8px 0 var(--ink);padding:24px 28px;font-size:24px;line-height:1.45;font-weight:700;width:100%}
.txtcard b{background:linear-gradient(transparent 58%,#ffe27a 58%)}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--pink);border:3px solid var(--ink);border-radius:22px;padding:5px 18px;font-family:Fredoka,sans-serif;font-weight:600;font-size:19px;box-shadow:3px 4px 0 var(--ink)}
.chip:nth-child(2){background:var(--mint)}.chip:nth-child(3){background:var(--sun)}
.blist{list-style:none;width:100%;display:flex;flex-direction:column;gap:13px}
.blist li{display:flex;gap:14px;align-items:flex-start;background:var(--cream);border:3px solid var(--ink);border-radius:20px 24px 20px 24px;box-shadow:4px 5px 0 var(--ink);padding:10px 16px;font-size:21px;line-height:1.3;font-weight:700}
.blist li i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;border:3px solid var(--ink);font:700 18px/28px Fredoka,sans-serif;text-align:center;font-style:normal}
.split{display:grid;grid-template-columns:1.12fr 1fr;gap:48px;align-items:center;width:100%;max-width:1168px}
.split .col{display:flex;flex-direction:column;gap:20px;align-items:center}

/* kover & penutup */
.cover{display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:36px;width:100%;height:100%}
.cover .cl{display:flex;flex-direction:column;align-items:center;gap:26px}
.go{background:var(--coral);color:#fff;border:4px solid var(--ink);border-radius:30px;padding:10px 44px;font:700 28px Fredoka,sans-serif;box-shadow:5px 6px 0 var(--ink);cursor:pointer}
.go:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.slide.on .go{animation:gop 1.4s ease-in-out 1.5s infinite}@keyframes gop{50%{scale:1.07}}

/* anggota */
.members{display:flex;gap:48px;justify-content:center;width:100%}
.member{width:270px;background:var(--cream);border:4px solid var(--ink);border-radius:30px 34px 28px 36px/34px 28px 36px 30px;box-shadow:6px 8px 0 var(--ink);padding:12px 8px 18px;text-align:center;font:700 26px Fredoka,sans-serif}
.member .av{height:200px;margin-bottom:6px}.member .av svg{width:100%;height:100%}

/* daftar isi */
.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;width:100%;max-width:1100px}
.toc .card{cursor:pointer;padding:22px 10px 20px;gap:12px}
.toc .card h3{font-size:23px;margin:0}
.toc .num{width:64px;height:64px;border-radius:50%;background:var(--c);border:3.5px solid var(--ink);font:700 32px/57px Fredoka,sans-serif;text-align:center}

/* ringkasan gaya */
.gcards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:100%;max-width:1168px}
.gcard{background:var(--cream);border:4px solid var(--ink);border-radius:28px 32px 26px 34px/32px 26px 34px 28px;box-shadow:5px 7px 0 var(--ink);padding:10px 10px 16px;text-align:center;cursor:pointer}
.gcard .pool{border-width:3px;border-radius:20px;box-shadow:none;margin-bottom:10px}
.gcard h4{font:700 25px Fredoka,sans-serif;margin-bottom:3px}.gcard p{font-size:16.5px;font-weight:700;opacity:.85;line-height:1.2}
.card,.gcard,.member{transition:translate .25s cubic-bezier(.3,1.6,.5,1)}.card:hover,.gcard:hover,.member:hover{translate:0 -6px}
.blist li{transition:translate .25s}.blist li:hover{translate:5px 0}
.slide.on .card .ic{animation:icp .8s cubic-bezier(.3,1.9,.5,1) calc(.85s + var(--n,0)*.09s) backwards}
@keyframes icp{from{transform:scale(0) rotate(-40deg)}}

/* pelatih */
.cch{position:absolute;bottom:54px;width:92px;height:120px;z-index:5;cursor:pointer}
.cch svg{width:100%;height:100%;overflow:visible}
.cch.R{right:28px}.cch.L{left:28px}
.cch .g-body{animation:cb 1.6s ease-in-out infinite;transform-origin:40px 98px}.cch .g-arm{animation:cw 1.1s ease-in-out infinite;transform-origin:58px 52px}
.cch .g-head{animation:ch 2.4s ease-in-out infinite;transform-origin:40px 44px}
.cch .g-eye{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}
.cch .g-mouth{animation:mo 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes cb{50%{transform:scale(1.02,.97)}}@keyframes cw{50%{transform:rotate(-24deg)}}@keyframes ch{50%{transform:rotate(3deg)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes mo{50%{transform:scale(1,.55)}}
.say{position:absolute;bottom:96px;max-width:520px;background:#fff;border:3.5px solid var(--ink);border-radius:24px;box-shadow:4px 5px 0 var(--ink);padding:10px 20px;font:700 20px/1.25 Fredoka,sans-serif;z-index:5;pointer-events:none}
.say.R{right:132px}.say.L{left:132px}
.say:after{content:"";position:absolute;top:50%;margin-top:-8px;width:16px;height:16px;background:#fff}
.say.R:after{right:-10px;border-top:3.5px solid var(--ink);border-right:3.5px solid var(--ink);transform:rotate(45deg)}
.say.L:after{left:-10px;border-bottom:3.5px solid var(--ink);border-left:3.5px solid var(--ink);transform:rotate(45deg)}
.slide.on .say{animation:sp .6s .8s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes sp{from{transform:scale(.2);opacity:0}}

/* kontrol */
.bar{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:30;display:flex;align-items:center;justify-content:center;gap:18px}
.btn{height:42px;min-width:110px;padding:0 20px;border-radius:24px;border:3px solid var(--ink);background:var(--sun);font:700 18px Fredoka,sans-serif;color:var(--ink);box-shadow:3px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.btn[disabled]{opacity:.45}
.btn.nx{background:var(--coral);color:#fff}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid var(--ink);transition:all .3s;cursor:pointer}.dots i.on{background:var(--sun);transform:scale(1.5)}
.cnt{position:absolute;top:14px;left:18px;z-index:30;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:2px 14px;font:700 16px Fredoka,sans-serif;box-shadow:2px 3px 0 var(--ink)}
.fs{position:absolute;top:12px;right:18px;z-index:30;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-size:19px;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.hint{position:absolute;right:26px;bottom:18px;z-index:30;color:#fff;font:600 13px Fredoka,sans-serif;opacity:.8;text-shadow:0 1px 0 rgba(14,47,79,.6)}

/* anjuran putar layar di HP potret */
#rot{display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:var(--sun);border-bottom:3px solid var(--ink);color:var(--ink);font:700 15px Fredoka,sans-serif;text-align:center;padding:8px}
@media (orientation:portrait) and (max-width:800px){#rot{display:block}}
@media (prefers-reduced-motion:reduce){.bub,.rays i.ray,.waves svg{animation:none}}
</style></head><body>
<div id="rot">↻ Putar layar ke mode landscape untuk tampilan terbaik</div>
<div class="stage">
<div class="bgl" id="bg1"></div><div class="bgl" id="bg2"></div><div class="rays"><i class="ray"></i><i class="ray"></i><i class="ray"></i></div>
<div class="waves"><svg class="b" viewBox="0 0 2400 120" preserveAspectRatio="none"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" style="fill:var(--w1)"/></svg><svg viewBox="0 0 2400 120" preserveAspectRatio="none" style="opacity:.55"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" style="fill:var(--w2)"/></svg></div>
<div id="deck">
  <div id="decos"></div>
  <div id="slides"></div>
  <div class="cnt"></div><button class="fs" title="Layar penuh (F)">⛶</button><div class="hint">← → ganti slide · F layar penuh</div>
  <div class="bar"><button class="btn" id="prev">◂ Balik</button><div class="dots"></div><button class="btn nx" id="next">Lanjut ▸</button></div>
</div>
</div>
<script>/* =========================================================
   B1 — HELPER SMIL, PERENANG (tampak samping), ORANG (tampak depan), PELATIH
   ========================================================= */
const INK = '#0e2f4f', SKIN = '#f6c9a0', SKIN2 = '#dba477', SUIT = '#ff6b5e', SUIT2 = '#d9483f', CAP = '#ffd23f', TRUNK = '#2b6cb0';
const KS = '.45 0 .55 1';
const spl = n => Array(n - 1).fill(KS).join(';');

function rotG(v, dur, beg, inner, kt, lin) {
  if (!Array.isArray(v)) return v ? `<g transform="rotate(${v})">${inner}</g>` : inner;
  const n = v.length, times = kt || v.map((_, i) => (i / (n - 1)).toFixed(3)).join(';');
  return `<g><animateTransform attributeName="transform" type="rotate" values="${v.join(';')}" keyTimes="${times}" dur="${dur}s" begin="${-beg}s" repeatCount="indefinite" ${lin ? 'calcMode="linear"' : `calcMode="spline" keySplines="${spl(n)}"`}/>${inner}</g>`;
}
function moveG(v, dur, beg, inner, kt, lin) {
  if (!Array.isArray(v)) return inner;
  const n = v.length, times = kt || v.map((_, i) => (i / (n - 1)).toFixed(3)).join(';');
  return `<g><animateTransform attributeName="transform" type="translate" values="${v.map(p => p.join(' ')).join(';')}" keyTimes="${times}" dur="${dur}s" begin="${-beg}s" repeatCount="indefinite" ${lin ? 'calcMode="linear"' : `calcMode="spline" keySplines="${spl(n)}"`}/>${inner}</g>`;
}
function limb(px, py, base, l1, l2, A, B, dur, beg, lag, col, w, tip, k) {
  k = k || {};
  const c2 = k.c2 || col, ink = w + 2.6;
  const lower = `<line x2="${l2}" stroke="${INK}" stroke-width="${ink}" stroke-linecap="round"/><line x2="${l2}" stroke="${c2}" stroke-width="${w}" stroke-linecap="round"/>${tip || ''}`;
  const upper = `<line x2="${l1}" stroke="${INK}" stroke-width="${ink}" stroke-linecap="round"/><g transform="translate(${l1} 0)">${rotG(B, dur, beg + lag, lower, k.Bk, k.Bl)}</g><line x2="${l1}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
  return `<g transform="translate(${px} ${py}) rotate(${base})">${rotG(A, dur, beg, upper, k.Ak, k.Al)}</g>`;
}
const handT = (l2, c) => `<circle cx="${l2}" r="3" fill="${c}" stroke="${INK}" stroke-width="1.2"/>`;
const footT = (l2, c) => `<ellipse cx="${l2 + 1.6}" cy=".4" rx="4.3" ry="2.4" fill="${c}" stroke="${INK}" stroke-width="1.2"/>`;

function headG(x, y, o = {}) {
  const mouth = o.mouthO
    ? `<ellipse cx="5.8" cy="4.9" rx="1.7" ry="2" fill="#7a2a2a"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="${o.mkt || '0;.5;.6;.88;1'}" dur="${o.D}s" begin="${-(o.beg || 0)}s" repeatCount="indefinite"/></ellipse>`
    : `<path d="M2.6 4.5 Q5.2 6.5 7.6 4.1" stroke="#8a3a3a" stroke-width="1.25" fill="none" stroke-linecap="round"/>`;
  const face = `<circle r="8.3" fill="${SKIN}" stroke="${INK}" stroke-width="1.6"/>
    <path d="M-8.2 1.6 C-9.4 -8 -1 -10.8 5.6 -7.5 C8.9 -5.6 9.3 -1 8.4 .8 Q0 -2 -8.2 1.6Z" fill="${o.cap || CAP}" stroke="${INK}" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-7.8 -1.4 L1.2 -2.7" stroke="${INK}" stroke-width="1.1" opacity=".5"/>
    <circle cx="4.3" cy="-.3" r="3.2" fill="#c9f1ff" stroke="${INK}" stroke-width="1.2"/><circle cx="5" cy="-.3" r="1.15" fill="${INK}"/><path d="M2.9 -1.8 l1.4 -.5" stroke="#fff" stroke-width=".9" stroke-linecap="round"/>
    ${mouth}`;
  return `<g transform="translate(${x} ${y})">${rotG(o.rot === undefined ? 0 : o.rot, o.D || 2, o.beg || 0, face, o.kt)}</g>`;
}
function puff(x, y, D, at, big) {
  let s = '';
  [[0, 0, 1.6], [3, -4, 1.2], [-2, -8, 1.9]].forEach((b, i) => {
    const r = b[2] * (big ? 1.35 : 1), t = (at + i * .035) * D;
    s += `<circle cx="${x + b[0]}" cy="${y + b[1]}" r="${r}" fill="#e9fbff" stroke="#8fd8ff" stroke-width=".6" opacity="0"><animateTransform attributeName="transform" type="translate" values="0 0;${-2 + i} -${16 + i * 3}" dur="${D * .38}s" begin="${t}s;${t + D}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;0" dur="${D * .38}s" begin="${t}s;${t + D}s" repeatCount="indefinite"/></circle>`;
  });
  return s;
}
const torsoSide = `<line x1="58" y1="41" x2="88" y2="40" stroke="${INK}" stroke-width="14.6" stroke-linecap="round"/><line x1="58" y1="41" x2="88" y2="40" stroke="${SUIT}" stroke-width="11.8" stroke-linecap="round"/><line x1="64" y1="37.4" x2="84" y2="36.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>`;
const hipCap = `<circle cx="58" cy="41" r="7.4" fill="${SUIT2}" stroke="${INK}" stroke-width="1.4"/>`;

function swimG(st, o = {}) {
  const arm = (c, beg, A, B, D, k) => limb(88, 40, 0, 15, 14, A, B, D, beg, .07, c, 5, handT(14, c), k);
  const leg = (c, beg, A, B, D, k) => limb(58, 41, 180, 16, 15, A, B, D, beg, .09, c, 6.4, footT(15, c), k);
  let far = '', near = '', body = '', headS = '', extra = '', wrap = v => v;

  if (st === 'free' || st === 'breath') {
    const D = st === 'breath' ? 2.6 : 1.7, big = st === 'breath';
    const ak = { Ak: '0;.42;1', Al: true, Bk: '0;.2;.42;.7;1' };
    const aA = [-180, -3, 180], aB = [50, 22, -4, 34, 50];
    far = arm(SKIN2, D / 2, aA, aB, D, ak) + leg(SKIN2, .23, [-13, 13, -13], [8, -26, 8], .46);
    near = leg(SKIN, 0, [-13, 13, -13], [8, -26, 8], .46) + arm(SKIN, 0, aA, aB, D, ak);
    headS = headG(99, 35.2, { rot: [0, 0, big ? -44 : -34, big ? -44 : -34, 0], kt: '0;.45;.6;.88;1', D, mouthO: true, mkt: '0;.5;.6;.88;1' }) + puff(106, 39, D, .6, big);
    wrap = v => moveG([[0, 0], [0, 1.4], [0, 0]], D, 0, v);
  } else if (st === 'back') {
    const D = 1.9, ak = { Ak: '0;.42;1', Al: true };
    const aA = [-180, -3, 180], aB = [8, 4, 0, 4, 8];
