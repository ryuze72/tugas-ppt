<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tugas Sekolah — Olahraga</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#2f2f2f;--bg2:#3a3a3a;
  --yellow:#f4e04d;--lime:#c5e384;--green:#2f7d3a;
  --purple:#7b7fd6;--orange:#e8903a;--blue:#a9c8ee;
  --cream:#f5f0e1;--ink:#1a1a1a;--white:#fff;
}
html,body{height:100%;overflow:hidden;background:#1a1a1a;font-family:'Quicksand',sans-serif}
.stage{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}

/* stars */
.stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}

/* slides */
.slide{
  position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  z-index:1;display:flex;align-items:center;justify-content:center;padding:1.4rem 1.2rem 4.2rem;
}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:5;animation:slideIn .8s cubic-bezier(.22,1,.36,1) both}

.blob{position:relative}
.blob-y{background:var(--yellow)}
.blob-g{background:var(--lime)}
.blob-p{background:var(--purple)}
.blob-c{background:var(--cream)}
.blob-o{background:var(--orange)}
.blob-b{background:var(--blue)}

.h1{font-family:'Fredoka',sans-serif;font-weight:700;line-height:1.1;color:var(--ink)}
.h2{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.15;color:var(--ink)}
.body{font-family:'Quicksand',sans-serif;color:#2a2a2a;line-height:1.5}

.deco{position:absolute;pointer-events:none;z-index:2}
.sun{
  width:68px;height:68px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 8px rgba(244,224,77,.22);animation:spin 22s linear infinite;
}
.sun::before,.sun::after{content:'';position:absolute;background:var(--yellow)}
.sun::before{width:11px;height:86px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px}
.sun::after{width:86px;height:11px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.cloud{width:68px;height:26px;background:#fff;border-radius:40px;position:relative;opacity:.9}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;top:-16px;left:10px}
.cloud::after{width:26px;height:26px;top:-10px;right:12px}

/* nav */
.nav{
  position:absolute;bottom:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1rem;background:rgba(18,18,18,.94);border-top:2px solid #4a4a4a;gap:.5rem;
}
.btn{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;
  padding:.5rem 1.1rem;border:none;border-radius:999px;cursor:pointer;
  transition:transform .15s,background .15s;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-prev{background:#4a4a4a;color:#fff}
.btn-next{background:var(--yellow);color:#1a1a1a;box-shadow:0 3px 12px rgba(244,224,77,.35)}
.dots{display:flex;gap:6px;align-items:center;justify-content:center;max-width:180px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#555;border:none;cursor:pointer;transition:all .25s}
.dot.on{background:var(--yellow);width:20px;border-radius:6px}
.counter{
  position:absolute;top:.65rem;right:1rem;z-index:40;
  font-family:'Fredoka',sans-serif;font-size:.72rem;color:#ccc;
  background:rgba(0,0,0,.45);padding:.28rem .65rem;border-radius:999px;
}
.toc-btn{
  position:absolute;top:.65rem;left:1rem;z-index:40;
  font-family:'Fredoka',sans-serif;font-size:.72rem;
  background:var(--purple);color:#fff;border:none;padding:.32rem .8rem;
  border-radius:999px;cursor:pointer;
}

/* pop (lihat blok ANIMASI di bawah) */

/* member */
.member{
  background:#3f3f3f;border-radius:18px;padding:.9rem .8rem;text-align:center;
  border:2px solid #555;width:155px;
}
.avatar{
  width:68px;height:68px;border-radius:50%;margin:0 auto .55rem;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;color:#fff;border:3px solid #fff;overflow:hidden;
  background-size:cover;background-position:center;
}
.member .name{font-family:'Fredoka',sans-serif;font-size:.92rem;color:var(--yellow);margin-bottom:.12rem}
.member .role{font-size:.72rem;color:#bbb}

.toc-num{
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;
  background:#6b4a2a;color:#fff;transition:transform .15s,background .15s;
  box-shadow:0 3px 0 #4a3018;
}
.toc-num:hover{transform:translateY(-3px);background:#8a5a30}

.wrap{position:relative;z-index:3;width:100%;max-width:1080px;margin:0 auto}

@media(max-width:700px){
  .member{width:115px;padding:.65rem}
  .avatar{width:52px;height:52px;font-size:1.25rem}
  .toc-num{width:40px;height:40px;font-size:.8rem}
  .h1{font-size:1.55rem!important}
  .h2{font-size:1.2rem!important}
}

/* =========================================================
   ANIMASI & TRANSISI (v2)
   ========================================================= */
.deco.cloud{position:absolute}
.deco{translate:calc(var(--mx,0)*22px) calc(var(--my,0)*14px);transition:translate .5s ease-out}
.stars{translate:calc(var(--mx,0)*-14px) calc(var(--my,0)*-10px);transition:translate .6s ease-out}

@keyframes slideIn{
  from{opacity:0;transform:translateX(calc(var(--dx,60px)*.5)) scale(.95)}
  to{opacity:1;transform:none}
}

/* transisi: dua lapis warna melebar dari pojok, lalu memudar */
.wipe{position:absolute;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.wipe i{position:absolute;inset:0;clip-path:circle(0px at var(--ox,100%) var(--oy,100%))}
.wipe i:nth-child(1){background:var(--purple)}
.wipe i:nth-child(2){background:var(--yellow)}
.wipe.go{animation:wipeFade .32s ease .46s both}
.wipe.go i{animation:iris .38s cubic-bezier(.6,0,.3,1) both}
.wipe.go i:nth-child(2){animation-delay:.07s}
@keyframes iris{from{clip-path:circle(0px at var(--ox,100%) var(--oy,100%))}to{clip-path:circle(150% at var(--ox,100%) var(--oy,100%))}}
@keyframes wipeFade{to{opacity:0}}

/* progress bar atas */
.progress{position:absolute;top:0;left:0;height:5px;z-index:60;width:100%;transform-origin:0 50%;transform:scaleX(calc(var(--p,10)/100));background:linear-gradient(90deg,var(--yellow),var(--lime),var(--purple));transition:transform .8s cubic-bezier(.22,1,.36,1)}
.confetti{position:absolute;inset:0;width:100%;height:100%;z-index:35;pointer-events:none}
#cur{display:inline-block}

/* pop-in: arah berbeda-beda (--from diisi JS), efek pegas */
.pop{opacity:0;transform:var(--from,scale(.88));
  transition:opacity .5s ease,transform .85s cubic-bezier(.34,1.56,.64,1)}
.slide.active .pop{opacity:1;transform:none;will-change:transform,opacity;transition-delay:calc(.1s + var(--n,0)*.08s)}
.p7{--n:6}.p1{--n:0}.p2{--n:1}.p3{--n:2}.p4{--n:3}.p5{--n:4}.p6{--n:5}
.slide.active.settled .pop{transition-delay:0s;will-change:auto}
.slide.active .pop[style*="border-radius"]:hover,.slide.active .member:hover{
  transform:translateY(-6px) scale(1.04) rotate(-1deg);transition-duration:.3s;transition-delay:0s}

/* blob bermorfing */
@keyframes morph{
  0%,100%{border-radius:30% 70% 60% 40%/50% 40% 60% 50%}
  33%{border-radius:55% 45% 40% 60%/40% 60% 45% 55%}
  66%{border-radius:42% 58% 62% 38%/58% 42% 52% 48%}
}
.blob{animation:breathe 6s ease-in-out infinite;animation-delay:var(--md,0s)}
@keyframes breathe{0%,100%{rotate:-.7deg;scale:1}50%{rotate:.7deg;scale:1.03}}

/* judul cover huruf demi huruf */
.letter{display:inline-block;opacity:0}
.slide.active .letter{animation:letterIn .75s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.12s + var(--i)*.05s)}
@keyframes letterIn{from{opacity:0;transform:translateY(55px) rotate(10deg) scale(.5)}to{opacity:1;transform:none}}

/* tombol daftar isi muncul satu-satu */
.toc-item{opacity:0}
.slide.active .toc-item{animation:tocIn .65s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(.2s + var(--i)*.07s)}
@keyframes tocIn{from{opacity:0;transform:scale(.3) translateY(14px) rotate(-12deg)}to{opacity:1;transform:none}}

/* ikon hidup */
.ic{display:block;transform-origin:50% 100%}
.ic-bola{animation:bounce 1.8s ease-in-out infinite}
.ic-basket{animation:bounce 1.8s ease-in-out infinite .35s}
.ic-piala{animation:wiggle 3s ease-in-out infinite;transform-origin:50% 90%}
.ic-sepatu{animation:tilt 2.2s ease-in-out infinite}
.ic-pelari{animation:run 1.1s ease-in-out infinite}
.ic-bumi{animation:spin 40s linear infinite;transform-origin:50% 50%}
@keyframes bounce{
  0%{transform:translateY(0) scale(1.1,.88) rotate(0)}
  12%{transform:translateY(0) scale(1) rotate(30deg)}
  50%{transform:translateY(-24px) scale(1) rotate(200deg)}
  88%{transform:translateY(0) scale(1) rotate(330deg)}
  100%{transform:translateY(0) scale(1.1,.88) rotate(360deg)}
}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3px)}}
@keyframes run{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}

/* dekorasi */
.sun{animation:spin 22s linear infinite}
@keyframes glow{
  0%,100%{box-shadow:0 0 0 8px rgba(244,224,77,.22)}
  50%{box-shadow:0 0 0 18px rgba(244,224,77,.1),0 0 40px rgba(244,224,77,.35)}
}
.cloud{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
.shoot{position:absolute;top:8%;left:-12%;width:100px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 9s linear infinite 2.5s;z-index:0}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) rotate(25deg)}
  2%{opacity:1}
  9%{opacity:0;transform:translate(125vw,58vh) rotate(25deg)}
  100%{opacity:0;transform:translate(125vw,58vh) rotate(25deg)}
}

/* tombol */
.btn:active:not(:disabled){transform:scale(.93)}
.btn-next{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:translateX(0)}88%{transform:translateX(5px)}94%{transform:translateX(-1px)}}
.btn-next:hover{animation:none}

.btn{white-space:nowrap}
@media(max-width:700px){
  .nav{padding:.55rem .7rem;gap:.4rem}
  .btn{font-size:.8rem;padding:.5rem .85rem}
  .dots{max-width:none;flex-wrap:nowrap;gap:4px;flex:1}
  .dot{width:7px;height:7px}.dot.on{width:15px}
  .counter,.toc-btn{top:.8rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

/* ilustrasi */
.heart-bg{position:absolute;left:50%;top:50%;translate:-50% -50%;width:118%;max-width:560px;height:auto;z-index:0;pointer-events:none;animation:heartbeat 1.3s ease-in-out infinite}
@keyframes heartbeat{0%,100%{scale:1}15%{scale:1.05}30%{scale:1}45%{scale:1.04}}
.ic-bolaK{transform-origin:50% 50%;animation:spin 5s linear infinite}
.card-ic{display:block;width:44px;height:44px;flex:0 0 auto}
.card-ic.big{width:64px;height:64px}
.card-ic svg{width:100%;height:100%}
.ic-lari{animation:run 1.1s ease-in-out infinite}
.ic-beladiri{animation:wiggle 1.6s ease-in-out infinite}
.ic-renang{animation:tilt 2.4s ease-in-out infinite}
.ic-senam{animation:wiggle 3s ease-in-out infinite}
.ic-hati,.ic-bolt,.ic-teknik,.ic-stop{transform-origin:50% 50%;animation:pulse 1.1s ease-in-out infinite}
.ic-dumbbell{animation:lift 1.3s ease-in-out infinite}
.ic-smile{animation:tilt 2.5s ease-in-out infinite}
.ic-medal{transform-origin:50% 0;animation:wiggle 2.4s ease-in-out infinite}
.ic-plester,.ic-botol,.ic-sepatu2{animation:tilt 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@keyframes lift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.arrow{display:inline-block;animation:arrowgo 1.2s ease-in-out infinite}
@keyframes arrowgo{0%,100%{translate:0 0}50%{translate:6px 0}}

/* jumping jack */
.jj-body{animation:jjBody .55s ease-in-out infinite alternate}
.jj-armL{transform-origin:106px 64px;animation:jjL .55s ease-in-out infinite alternate}
.jj-armR{transform-origin:134px 64px;animation:jjR .55s ease-in-out infinite alternate}
.jj-legL{transform-origin:112px 108px;animation:jjLL .55s ease-in-out infinite alternate}
.jj-legR{transform-origin:128px 108px;animation:jjRR .55s ease-in-out infinite alternate}
.jj-ball{animation:jjBall 1.1s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes jjBody{from{transform:translateY(0)}to{transform:translateY(-12px)}}
@keyframes jjL{from{transform:rotate(8deg)}to{transform:rotate(168deg)}}
@keyframes jjR{from{transform:rotate(-8deg)}to{transform:rotate(-168deg)}}
@keyframes jjLL{from{transform:rotate(0)}to{transform:rotate(17deg)}}
@keyframes jjRR{from{transform:rotate(0)}to{transform:rotate(-17deg)}}
@keyframes jjBall{from{transform:translateY(0)}to{transform:translateY(-34px)}}

/* pelari */
.run-body{animation:runBob .3s ease-in-out infinite alternate}
.rn-a{transform-origin:138px 60px;animation:rnA .3s ease-in-out infinite alternate}
.rn-b{transform-origin:138px 60px;animation:rnB .3s ease-in-out infinite alternate}
.rn-c{transform-origin:128px 96px;animation:rnA .3s ease-in-out infinite alternate}
.rn-d{transform-origin:128px 96px;animation:rnB .3s ease-in-out infinite alternate}
.heart-p{transform-origin:214px 44px;animation:pulse .8s ease-in-out infinite}
.speed{animation:speed .45s linear infinite}
.track-line{animation:track .5s linear infinite}
@keyframes runBob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes rnA{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
@keyframes rnB{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes speed{from{transform:translateX(20px);opacity:0}30%{opacity:.6}to{transform:translateX(-24px);opacity:0}}
@keyframes track{to{stroke-dashoffset:-28}}

/* ===== saat transisi: ringankan kerja browser ===== */
.vting .slide.active .pop:not([data-vt]){opacity:0!important;transform:var(--from,scale(.88))!important;transition:none!important}
.vting .slide.active .pop[data-vt]{opacity:1!important;transform:none!important;transition:none!important}
.vting .slide.active .letter,.vting .slide.active .toc-item{animation:none!important;opacity:0}
.vting *{animation-play-state:paused!important}
.slide:not(.active) *{animation-play-state:paused!important}
/* ===== TRANSISI MORPH (View Transitions) ===== */
#slides-root{position:absolute;inset:0;--vtn:slides}
.slide.active [data-vt=sun]{--vtn:vt-sun}
.slide.active [data-vt=c1]{--vtn:vt-c1}
.slide.active [data-vt=c2]{--vtn:vt-c2}
.slide.active [data-vt=title]{--vtn:vt-title}
.vting .slide.active{animation:none}
::view-transition-group(vt-sun),::view-transition-group(vt-c1),::view-transition-group(vt-c2),::view-transition-group(vt-title){
  animation-duration:.7s;animation-timing-function:cubic-bezier(.65,0,.2,1)}
::view-transition-old(vt-sun),::view-transition-new(vt-sun),
::view-transition-old(vt-c1),::view-transition-new(vt-c1),
::view-transition-old(vt-c2),::view-transition-new(vt-c2),
::view-transition-old(vt-title),::view-transition-new(vt-title){height:100%;width:100%;object-fit:contain;mix-blend-mode:normal}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s;mix-blend-mode:normal}
::view-transition-old(slides),::view-transition-new(slides){mix-blend-mode:normal}
::view-transition-old(slides){animation:vtOut .35s cubic-bezier(.4,0,1,1) both}
::view-transition-new(slides){animation:vtIn .6s cubic-bezier(.22,1,.36,1) .08s both}
@keyframes vtOut{to{opacity:0;transform:translateX(calc(var(--vx,60px)*-.7)) scale(.97)}}
@keyframes vtIn{from{opacity:0;transform:translateX(var(--vx,60px)) scale(.97)}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}


/* ===== presenter: karakter penjelas tiap slide ===== */
.guru{position:absolute;bottom:58px;z-index:3;display:flex;align-items:flex-end;gap:6px;pointer-events:none;width:max-content;max-width:calc(100% - 150px)}
.guru.L{left:10px}.guru.R{right:10px;flex-direction:row-reverse}
.guru-c{width:62px;flex:0 0 auto}.guru-c svg{width:100%;height:auto;display:block;overflow:visible}
.guru-b{position:relative;background:var(--cream);color:#1a1a1a;font-family:'Fredoka',sans-serif;font-size:.74rem;line-height:1.25;padding:.5em .8em;border-radius:14px;max-width:168px;margin-bottom:34px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.guru.L .guru-b::after{content:'';position:absolute;left:-7px;bottom:10px;border:7px solid transparent;border-right-color:var(--cream);border-left:0}
.guru.R .guru-b::after{content:'';position:absolute;right:-7px;bottom:10px;border:7px solid transparent;border-left-color:var(--cream);border-right:0}
.g-body{animation:gBob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.g-arm{animation:gWave 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:58px 54px}
.g-arm2{animation:gWave2 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:22px 54px}
.g-mouth{animation:gTalk .34s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
.g-eye{animation:gBlink 3.4s infinite;transform-box:fill-box;transform-origin:50% 50%}
.g-head{animation:gNod 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:40px 44px}
@keyframes gBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes gWave{0%,100%{transform:rotate(-125deg)}50%{transform:rotate(-165deg)}}
@keyframes gWave2{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}}
@keyframes gTalk{from{transform:scaleY(.3)}to{transform:scaleY(1.1)}}
@keyframes gBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes gNod{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@media(min-width:701px){.guru-c{width:78px}.guru-b{font-size:.9rem;max-width:230px;margin-bottom:42px}.guru{bottom:62px}}


/* ===== tur penjelasan per butir ===== */
.tour-on .slide.active .tour-it{transition:opacity .45s ease,filter .45s ease,transform .5s cubic-bezier(.22,1,.36,1),box-shadow .45s ease;cursor:pointer;pointer-events:auto}
.tour-on .slide.active .tour-it:not(.hl){opacity:.5;filter:saturate(.7)}
.slide.active .tour-it.hl{transform:scale(1.035);box-shadow:0 0 0 3px #fff,0 8px 22px rgba(0,0,0,.45);position:relative;z-index:2}
.slide.active .tour-it.hl svg{animation:itPop .9s ease-in-out infinite alternate}
@keyframes itPop{from{transform:scale(1)}to{transform:scale(1.18) rotate(-4deg)}}
.guru-b.chg{animation:bIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes bIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
.card-ic.person svg{overflow:visible}.card-ic.person,.card-ic.person *{animation:none}
@media(max-width:700px){.slide[data-i="7"] .wrap>div:last-child>.pop:first-child svg{max-width:105px!important}.slide[data-i="7"] .wrap>.pop{margin-bottom:.3rem!important}}
.guru-no{display:inline-block;background:var(--yellow);border-radius:999px;padding:0 .55em;margin-right:.4em;font-size:.85em}

/* ===== konsep video: planet, bulan, mind map ===== */
.deco.planet,.deco.moon{opacity:1}
.deco.planet svg,.deco.moon svg{width:100%;height:auto}
.ic-planet{transform-origin:50% 50%;animation:spin 60s linear infinite}
.slide.active [data-vt=pl]{--vtn:vt-pl}
.slide.active [data-vt=mo]{--vtn:vt-mo}
.slide.active [data-vt=yb]{--vtn:vt-yb}
::view-transition-group(vt-pl),::view-transition-group(vt-mo),::view-transition-group(vt-yb){animation-duration:.7s;animation-timing-function:cubic-bezier(.65,0,.2,1)}

.mm{position:relative;width:min(100%,940px,calc((100vh - 8rem)*1.6));aspect-ratio:16/10;container-type:inline-size;margin:0 auto}

.mm-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.mm-line{fill:none;stroke:#d6d6d6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .mm-line{animation:draw .9s ease .35s forwards}
.vting .slide.active .mm-line{animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
.mm-n{position:absolute;z-index:1;left:calc(var(--x)*1%);top:calc(var(--y)*1%);translate:-50% -50%;
  width:max-content;max-width:var(--w,30cqw);padding:.55em .95em;border-radius:1.1em 1.5em 1.2em 1.4em;

  display:flex;align-items:center;justify-content:center;gap:.55em}
.mm-n.leaf{width:var(--w);justify-content:flex-start;text-align:left}
.mm-n.scene{width:var(--w);padding:0;background:none;border-radius:0}
.mm-n.scene svg{width:100%;max-width:none;height:auto}
.mm-root{font-size:clamp(.95rem,3.4cqw,1.8rem);background:var(--yellow);padding:.8em 1em;line-height:1.1}

  .mm-n.leaf,.mm-n.scene{width:var(--mw)}

function layoutMM(mm) {
  const svg = mm.querySelector('.mm-lines'); if (!svg) return;
  const W = mm.offsetWidth, H = mm.offsetHeight; if (!W) return;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const nodes = {}; mm.querySelectorAll('.mm-n[data-id]').forEach(n => nodes[n.dataset.id] = n);
  let out = '';
  mm.querySelectorAll('.mm-n[data-parent]').forEach(c => {
    const a = nodes[c.dataset.parent]; if (!a) return;
    const ax = a.offsetLeft, ay = a.offsetTop, aw = a.offsetWidth, ah = a.offsetHeight;
    const bx = c.offsetLeft, by = c.offsetTop, bw = c.offsetWidth, bh = c.offsetHeight;
    const dx = bx - ax, dy = by - ay; let d;
    if (Math.abs(dy) > Math.abs(dx) * 0.8) {
      const sg = Math.sign(dy) || 1, y1 = ay + sg * ah / 2, y2 = by - sg * bh / 2, m = (y1 + y2) / 2;
      d = `M${ax} ${y1} C${ax} ${m} ${bx} ${m} ${bx} ${y2}`;
    } else {
      const sg = Math.sign(dx) || 1, x1 = ax + sg * aw / 2, x2 = bx - sg * bw / 2, m = (x1 + x2) / 2;
      d = `M${x1} ${ay} C${m} ${ay} ${m} ${by} ${x2} ${by}`;
    }
    out += `<path class="mm-line" pathLength="1" d="${d}"/>`;
  });
  svg.innerHTML = out;
}
const layoutAll = () => document.querySelectorAll('.mm').forEach(layoutMM);

let tourT = 0, tourS = 0;
function tourStop() {
  clearTimeout(tourT); tourS++;
  document.documentElement.classList.remove('tour-on');
  document.querySelectorAll('.tour-it.hl').forEach(e => e.classList.remove('hl'));
}
function tourSay(sl, html) {
  const b = sl.querySelector('.guru-b'); if (!b) return;
  b.innerHTML = html; b.classList.remove('chg'); void b.offsetWidth; b.classList.add('chg');
}
function tourStart(n) {
  tourStop();
  return; /* tur per-butir dimatikan: poin dibiarkan statis */
  const cfg = TOUR[n], sl = slides[n];
  if (!cfg) return;
  let its = [...sl.querySelectorAll(cfg.sel)];
  if (cfg.f) its = its.filter(cfg.f);
  its = its.slice(0, cfg.t.length);
  if (!its.length) return;
  its.forEach((e, k) => { e.classList.add('tour-it'); e.onclick = () => { if (tourOn(n)) tourShow(n, its, cfg, k, true); }; });
  const id = tourS;
  const run = k => {
    if (id !== tourS) return;
    tourShow(n, its, cfg, k % its.length, false);
    tourT = setTimeout(() => run(k + 1), 4200);
  };
  tourT = setTimeout(() => run(0), 2600);
}
const tourOn = n => i === n && !busy;
function tourShow(n, its, cfg, k, manual) {
  const sl = slides[n];
  document.documentElement.classList.add('tour-on');
  its.forEach((e, j) => e.classList.toggle('hl', j === k));
  tourSay(sl, `<span class="guru-no">${k + 1}</span>${cfg.t[k]}`);
  if (manual) {                       // klik manual: jeda otomatis lalu lanjut dari butir berikutnya
    clearTimeout(tourT); const id = ++tourS;
    const run = j => { if (id !== tourS) return; tourShow(n, its, cfg, j % its.length, false); tourT = setTimeout(() => run(j + 1), 4200); };
    tourT = setTimeout(() => run(k + 1), 5200);
  }
}


/* ===== orang animasi per poin (SMIL, kerangka sendi) ===== */
const FIG = (() => {
  const SKIN = '#f1c49b', SHIRT = '#e8903a', PANT = '#3b4aa0', INK = '#1a1a1a';
  const KS = '.45 0 .55 1';
  const arr = v => Array.isArray(v) ? v : [v];
  const anim = (type, vals, dur, ph) => {
    const n = vals.length, kt = vals.map((_, k) => (k / (n - 1)).toFixed(3)).join(';');
    return `<animateTransform attributeName="transform" type="${type}" values="${vals.join(';')}" keyTimes="${kt}" dur="${dur}s" begin="${-ph}s" repeatCount="indefinite" calcMode="spline" keySplines="${Array(n - 1).fill(KS).join(';')}"/>`;
  };
  const rot = (cx, cy, v, dur, ph = 0) => {
    v = arr(v);
    if (v.length === 1) return v[0] ? `transform="rotate(${v[0]} ${cx} ${cy})"` : '';
    return '>' + anim('rotate', v.map(a => `${a} ${cx} ${cy}`), dur, ph) + '<!--';
  };
  // grup berputar di sekitar (cx,cy); isi = konten; v = sudut (angka atau array)
  const grp = (cx, cy, v, dur, ph, inner) => {
    v = arr(v);
    if (v.length === 1) return `<g ${v[0] ? `transform="rotate(${v[0]} ${cx} ${cy})"` : ''}>${inner}</g>`;
    return `<g>${anim('rotate', v.map(a => `${a} ${cx} ${cy}`), dur, ph)}${inner}</g>`;
  };
  const limb = (sx, sy, l1, l2, col, w, U, F, dur, ph, extra = '', foot = false) => {
    const ex = sy + l1;
    const lower = `<line x1="${sx}" y1="${ex}" x2="${sx}" y2="${ex + l2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
      (foot ? `<ellipse cx="${sx + 2}" cy="${ex + l2 + 1}" rx="4.2" ry="2.3" fill="#fff" stroke="${INK}" stroke-width="1"/>` : `<circle cx="${sx}" cy="${ex + l2}" r="2.8" fill="${SKIN}"/>`) + (extra ? `<g transform="translate(${sx} ${ex + l2})">${extra}</g>` : '');
    const inner = `<line x1="${sx}" y1="${sy}" x2="${sx}" y2="${ex}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` + grp(sx, ex, F, dur, ph, lower);
    return grp(sx, sy, U, dur, ph, inner);
  };
  function fig(p) {
    const d = p.dur || 1.2, ph = p.ph || 0, ph2 = p.ph2 === undefined ? ph : p.ph2;
    const A = (k, def) => p[k] || def;
    const aL = A('aL', [0, 0]), aR = A('aR', [0, 0]), lL = A('lL', [0, 0]), lR = A('lR', [0, 0]);
    const legL = limb(28, 42, 12, 12, PANT, 6, lL[0], lL[1], d, ph, '', true);

function swap(n) {
  slides.forEach((s, idx) => { s.classList.toggle('active', idx === n); s.classList.remove('settled'); });
  i = n;
  const cur = document.getElementById('cur');
  cur.textContent = i + 1;
  cur.animate && cur.animate([{ transform: 'translateY(-9px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: 'ease-out' });
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === total - 1 ? 'Selesai ✓' : 'Lanjut →';
  document.getElementById('progress').style.setProperty('--p', ((i + 1) / total * 100).toFixed(1));
  renderDots();
  slides[n].querySelectorAll('.mm').forEach(layoutMM);
  tourStart(n);
  clearTimeout(settleT);
  settleT = setTimeout(() => slides[i].classList.add('settled'), 2300);
  confettiId++;
  clearConfetti();
  if (i === total - 1) { const id = confettiId; setTimeout(() => burst(id), 800); }
}

const rnd = x => { const v = Math.sin(x * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const SPIN = ['sun', 'pl', 'mo', 'c1', 'c2'];

function sweep(dir, W) {
  document.querySelectorAll('#slabs i').forEach((b, k) => {
    b.getAnimations().forEach(a => a.cancel());
    b.style.left = dir > 0 ? '-30%' : '130%';
    b.animate([
      { transform: 'translateX(0) skewX(-18deg)', opacity: 1 },
      { transform: `translateX(${dir * W * 1.9}px) skewX(-18deg)`, opacity: 1 }
    ], { duration: 760, delay: k * 85, easing: 'cubic-bezier(.7,0,.25,1)', fill: 'both' });
  });
}

/* beri identitas morph ke objek sejenis (kartu/node) berdasarkan urutan, seperti "nama objek" di PowerPoint */
function tagMorph() {
  slides.forEach(sl => {
    let k = 0;
    sl.querySelectorAll('.pop').forEach(e => {
      if (e.dataset.vt) return;
      const isCard = e.classList.contains('mm-n') || e.classList.contains('member') || /border-radius/.test(e.getAttribute('style') || '');
      if (isCard && !e.classList.contains('scene') && k < 8) e.dataset.vt = 'k' + (k++);
    });
    const root = sl.querySelector('.mm-root');
    if (root && !sl.querySelector('[data-vt="title"]')) root.dataset.vt = 'title';
  });
}
const EASE = 'cubic-bezier(.45,0,.2,1)', EASE_OUT = 'cubic-bezier(.22,1,.36,1)';

/* ===== ANIMASI MASUK 3D ===== */
const P3 = 'perspective(900px)';
const I3 = `${P3} translate3d(0px,0px,0px) rotateX(0deg) rotateY(0deg) scale(1)`;
function enterEls(slide, shared, dir, base) {
  [...slide.querySelectorAll('.pop, .deco')].filter(e => !(e.dataset.vt && shared.includes(e.dataset.vt))).forEach((el, k) => {
    const d = base + Math.min(k * 60, 380);
    if (el.classList.contains('deco')) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: d, easing: 'ease', fill: 'backwards' });
      return;
    }
    const m = k % 3;
    const from = m === 0 ? `${P3} translate3d(${dir * 70}px,24px,-320px) rotateX(10deg) rotateY(${-dir * 75}deg) scale(.9)`
               : m === 1 ? `${P3} translate3d(0px,70px,-200px) rotateX(-80deg) rotateY(0deg) scale(.92)`
               :           `${P3} translate3d(${-dir * 50}px,-30px,-420px) rotateX(0deg) rotateY(${dir * 55}deg) scale(.85)`;
    const o = m === 1 ? '50% 100%' : (dir > 0 ? '0% 50%' : '100% 50%');
    el.animate([
      { opacity: 0, transform: from, transformOrigin: o },
      { opacity: 1, offset: .3 },
      { opacity: 1, transform: I3, transformOrigin: o }
    ], { duration: 1100, delay: d, easing: 'cubic-bezier(.2,.85,.25,1.12)', fill: 'backwards' });
  });
}

/* ===== TRANSISI MORPH ala PowerPoint =====
   Slide TIDAK bergeser. Objek yang sama di dua slide (ditandai data-vt) = "objek berpasangan":
   ia terbang melengkung dari posisi lama ke posisi baru, berubah ukuran, sedikit miring/berputar,
   dan isinya saling memudar di tengah jalan. Objek tanpa pasangan memudar keluar / masuk.
   Semua animasi memakai transform/opacity (jalur GPU) + satu durasi & satu easing. */
function show(n, dir) {
  if (dir === undefined) { swap(n); return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !Element.prototype.animate) { swap(n); busy = false; return; }
  busy = true;
  const MD = 1250, EZ = 'cubic-bezier(.62,0,.2,1)';
  const old = slides[i], nw = slides[n];
  const om = {}, nm = {};
  old.querySelectorAll('[data-vt]').forEach(e => om[e.dataset.vt] = e);
  nw.querySelectorAll('[data-vt]').forEach(e => nm[e.dataset.vt] = e);
  const keys = Object.keys(om).filter(k => nm[k]);
  const box = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height });
  const sz = el => el.offsetWidth * (parseFloat(getComputedStyle(el).scale) || 1);

  /* BACA semua ukuran dulu → ubah state → baru animasikan (tanpa layout-thrash) */
  const O = {}, dOld = {};
  keys.forEach(k => { O[k] = box(om[k].getBoundingClientRect()); if (SPIN.includes(k)) dOld[k] = sz(om[k]); });
  old.classList.add('leaving');
  swap(n);
  const N = {}, nTr = {};
  keys.forEach(k => {
    N[k] = box(nm[k].getBoundingClientRect());
    if (SPIN.includes(k)) {
      const cs = getComputedStyle(nm[k]);
      const t = cs.translate === 'none' ? [0, 0] : cs.translate.split(' ').map(parseFloat);
      nTr[k] = { tx: t[0] || 0, ty: t[1] || 0, s: parseFloat(cs.scale) || 1 };
    }
  });

  const A = [];
  const an = (el, kf, o) => { const a = el.animate(kf, Object.assign({ duration: MD, easing: EZ, fill: 'both' }, o)); A.push(a); return a; };
  const Z = 'translate3d(0px,0px,0px)';
  const clamp = v => Math.max(.5, Math.min(2.1, v));
  /* lengkungan jalur: titik tengah digeser tegak lurus arah gerak → terbang melengkung, bukan garis lurus kaku */
  const arc = (vx, vy, sgn) => { const L = Math.hypot(vx, vy) || 1, m = Math.min(L * .16, 54) * sgn; return [-vy / L * m, vx / L * m]; };
  const LIN = { easing: 'linear' };

  /* objek berpasangan */
  keys.forEach((k, idx) => {
    const oe = om[k], ne = nm[k], a = O[k], b = N[k];
    const dx = a.x - b.x, dy = a.y - b.y;
    const sgn = (idx % 2 ? 1 : -1) * dir;
    const [px, py] = arc(dx, dy, sgn);
    if (SPIN.includes(k)) {
      /* dekorasi: properti translate/scale/rotate terpisah → putaran/melayang CSS bawaan tidak terputus */
      const t = nTr[k];
      const s0 = Math.max(.3, Math.min(3, dOld[k] / (ne.offsetWidth || 1)));
      oe.style.visibility = 'hidden';
      an(ne, [
        { translate: `${t.tx + dx}px ${t.ty + dy}px`, scale: String(s0), rotate: `${-dir * 150}deg` },
        { translate: `${t.tx + dx * .5 + px}px ${t.ty + dy * .5 + py}px`, scale: String((s0 + t.s) / 2 * 1.08), rotate: `${-dir * 70}deg`, offset: .5 },
        { translate: `${t.tx}px ${t.ty}px`, scale: String(t.s), rotate: '0deg' }
      ]);
    } else {
      /* kartu/judul/ilustrasi/pemandu */
      const sx = a.w / (b.w || 1), sy = a.h / (b.h || 1);
      const su = k === 'scene' ? clamp(Math.min(sx, sy)) : clamp(Math.sqrt(sx * sy));
      const eu = k === 'scene' ? clamp(Math.min(1 / sx, 1 / sy)) : clamp(Math.sqrt(1 / (sx * sy)));
      const tilt = (idx % 2 ? 1 : -1) * dir * (k === 'scene' ? 5 : 3);
      an(ne, [
        { transform: `translate3d(${dx}px,${dy}px,0px) scale(${su}) rotate(${-tilt}deg)` },
        { transform: `translate3d(${dx * .5 + px}px,${dy * .5 + py}px,0px) scale(${(su + 1) / 2}) rotate(${tilt}deg)`, offset: .5 },
        { transform: `${Z} scale(1) rotate(0deg)` }
      ]);
      an(ne, [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .1 }, { opacity: 1, offset: .5 }, { opacity: 1, offset: 1 }], LIN);
      /* objek lama menempuh jalur yang sama persis menuju posisi baru */
      an(oe, [
        { transform: `${Z} scale(1) rotate(0deg)` },
        { transform: `translate3d(${-dx * .5 + px}px,${-dy * .5 + py}px,0px) scale(${(1 + eu) / 2}) rotate(${tilt}deg)`, offset: .5 },
        { transform: `translate3d(${-dx}px,${-dy}px,0px) scale(${eu}) rotate(${-tilt}deg)` }
      ]);
      an(oe, [{ opacity: 1, offset: 0 }, { opacity: 1, offset: .4 }, { opacity: 0, offset: .8 }, { opacity: 0, offset: 1 }], LIN);
    }
  });

  /* objek tanpa pasangan: lama memudar duluan, baru muncul menyusul bertahap */
  const paired = new Set(keys.flatMap(k => [om[k], nm[k]]));
  [...old.querySelectorAll('.pop, .deco')].filter(e => !paired.has(e)).forEach(el => {
    if (el.classList.contains('deco')) an(el, [{ opacity: 1 }, { opacity: 0 }], { duration: MD * .45, easing: 'ease' });
    else an(el, [{ opacity: 1, transform: `${Z} scale(1)` }, { opacity: 0, transform: 'translate3d(0px,-10px,0px) scale(.95)' }], { duration: MD * .5, easing: 'cubic-bezier(.4,0,.7,1)' });
  });
  old.querySelectorAll('.mm-lines').forEach(l => an(l, [{ opacity: 1 }, { opacity: 0 }], { duration: MD * .4, easing: 'ease' }));
  [...nw.querySelectorAll('.pop, .deco')].filter(e => !paired.has(e)).forEach((el, k) => {
    const d = MD * .36 + Math.min(k * 40, 200), dur = MD * .5;
    if (el.classList.contains('deco')) an(el, [{ opacity: 0 }, { opacity: 1 }], { duration: dur, delay: d, easing: 'ease' });
    else an(el, [{ opacity: 0, transform: 'translate3d(0px,18px,0px) scale(.94)' }, { opacity: 1, transform: `${Z} scale(1)` }], { duration: dur, delay: d, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });

  setTimeout(() => {
    A.forEach(a => a.cancel());
    old.classList.remove('leaving');
    keys.forEach(k => { om[k].style.visibility = ''; });
  }, MD + 60);
  setTimeout(() => { busy = false; if (queued !== null) { const q = queued; queued = null; if (q !== i) go(q); } }, MD + 90);
}

function playWipe(dir) {
  const w = document.getElementById('wipe');
  w.innerHTML = '<i></i><i></i>';
  w.style.setProperty('--ox', dir > 0 ? '100%' : '0%');
  w.style.setProperty('--oy', '100%');
  w.classList.remove('go'); void w.offsetWidth; w.classList.add('go');
  setTimeout(() => { w.classList.remove('go'); w.innerHTML = ''; }, 900);
}

function go(n) {
  if (n < 0 || n >= total) return;
  if (busy) { queued = n; return; }
  if (n === i) return;
  show(n, n > i ? 1 : -1);
}
function goDir(d) { go((queued !== null ? queued : i) + d); }

/* confetti di slide terakhir */
const cv = document.getElementById('confetti');
function clearConfetti() { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); }
function burst(id) {
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const ctx = cv.getContext('2d');
  const cols = ['#f4e04d', '#c5e384', '#7b7fd6', '#e8903a', '#a9c8ee', '#ffffff'];
  const ps = Array.from({ length: 150 }, () => ({
    x: cv.width / 2, y: cv.height * 0.58,
    vx: (Math.random() - .5) * 20 * dpr, vy: (-Math.random() * 17 - 7) * dpr,
    s: (Math.random() * 7 + 5) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .5,
    c: cols[Math.floor(Math.random() * cols.length)], round: Math.random() < .35
  }));
  let t = 0;
  (function step() {
    if (id !== confettiId) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.vy += .42 * dpr; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    });
    if (++t < 230) requestAnimationFrame(step); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goDir(1); }
  else if (e.key === 'ArrowLeft') goDir(-1);
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(total - 1);
  else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});

let tx = 0;
document.getElementById('stage').addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; }, { passive: true });
document.getElementById('stage').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - tx;
  if (Math.abs(dx) > 50) goDir(dx < 0 ? 1 : -1);
}, { passive: true });

// stars
(function () {
  const box = document.getElementById('stars');
  for (let s = 0; s < 28; s++) {
    const el = document.createElement('div');
    el.className = 'star';
    el.style.left = Math.random() * 100 + '%';
    el.style.top = Math.random() * 100 + '%';
    el.style.animationDelay = Math.random() * 3 + 's';
    const sz = (Math.random() * 2 + 2) + 'px';
    el.style.width = el.style.height = sz;
    box.appendChild(el);
  }
})();

document.getElementById('tot').textContent = total;

/* ganti ikon poin dengan orang beranimasi yang memeragakan isi poin */
function peopleIcons() {
  const set = (sl, sel, names, w, h) => {
    const els = [...slides[sl].querySelectorAll(sel)];
    els.forEach((e, k) => { if (!names[k]) return; e.innerHTML = FIG(names[k]); e.style.width = w; e.style.height = h; e.classList.add('person'); e.style.animation = 'none'; });
  };
  set(8, '.mm-n.leaf .card-ic', ['warm', 'shoe', 'squat', 'drink', 'stop'], '4.6em', '5.2em');
  set(7, '.pop > .card-ic', ['heart', 'flex', 'bolt', 'relax', 'cheer'], '44px', '50px');
  set(6, '.mm-n.leaf .card-ic', ['kick', 'run', 'punch', 'swim', 'stretch'], '4em', '4.5em');
  set(9, '.card-ic', ['warm', 'run', 'drink'], '60px', '68px');
  // tujuan: ganti bintang
  [...slides[4].querySelectorAll('li > span:first-child')].forEach((e, k) => {
    const n = ['think', 'run', 'flex', 'warm'][k]; if (!n) return;
    e.className = 'card-ic person'; e.style.cssText = 'width:38px;height:43px;flex:0 0 auto'; e.innerHTML = FIG(n);
  });
}

renderSlides();
slides = [...document.querySelectorAll('.slide')];
peopleIcons();
slides.forEach(sl => {
  const sun = sl.querySelector('.sun'); if (sun) sun.dataset.vt = 'sun';
  const ti = sl.querySelector('.pop.p1.h2, .pop.p1.blob, .pop.p1[style*="inline-block"]'); if (ti) ti.dataset.vt = 'title';
  const cl = sl.querySelectorAll('.cloud'); if (cl[0]) cl[0].dataset.vt = 'c1'; if (cl[1]) cl[1].dataset.vt = 'c2';
  const pl = sl.querySelector('.planet'); if (pl) pl.dataset.vt = 'pl';
  const mo = sl.querySelector('.moon'); if (mo) mo.dataset.vt = 'mo';
  const yb = sl.querySelector('.pop.blob-y'); if (yb && !yb.dataset.vt) yb.dataset.vt = 'yb';
});
const FROM = ['translateY(34px) scale(.85)', 'translateX(-46px) rotate(-5deg) scale(.9)', 'translateX(46px) rotate(5deg) scale(.9)', 'scale(.4) rotate(-10deg)'];
slides.forEach(s => s.querySelectorAll('.pop').forEach((el, k) => el.style.setProperty('--from', FROM[k % FROM.length])));
document.querySelectorAll('.blob').forEach(b => b.style.setProperty('--md', (-Math.random() * 8).toFixed(2) + 's'));
(function () { const sh = document.createElement('div'); sh.className = 'shoot'; document.getElementById('stars').appendChild(sh); })();

// parallax mouse
const stageEl = document.getElementById('stage');
stageEl.addEventListener('mousemove', e => {
  stageEl.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(3));
  stageEl.style.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(3));
});
// scroll mouse / trackpad
let wheelAt = 0;
stageEl.addEventListener('wheel', e => {
  const now = Date.now();
  if (now - wheelAt < 1100 || Math.abs(e.deltaY) < 30) return;
  wheelAt = now; goDir(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

tagMorph(); layoutAll();
/* ilustrasi utama tiap slide (pulau, stadion, pelari, dst.) ikut berpasangan → terbang antar slide */
slides.forEach(sl => {
  const sv = sl.querySelector('svg[class*="ic-scene"]'), host = sv && sv.closest('.pop');
  if (host && !host.dataset.vt) host.dataset.vt = 'scene';
});
addEventListener('resize', layoutAll);
document.fonts && document.fonts.ready.then(layoutAll);
swap(0);
document.documentElement.classList.add('eng');
enterEls(slides[0], [], 1, 250);
</script>
</body>
