<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Olahraga Renang</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#0e2f4f;--coral:#ff6b5e;--sun:#ffd23f;--aqua:#27c4e8;--teal:#14a39a;--cream:#fffdf5;--mint:#9be8d0;--pink:#ffb3c7;--sky:#a8dcff;--peach:#ffc98a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a5f94;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1)}

/* ===== LATAR (memenuhi layar) ===== */
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#5fd8f5 0%,#23b5e0 45%,#0a5f94 100%);--w1:#1b9ed0;--w2:#0a6f9a}
.bgl{position:absolute;inset:0;transition:opacity 1.5s var(--ease-io);opacity:0;will-change:opacity}
.rays{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rays i.ray{position:absolute;top:-10%;width:20%;height:130%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transform:skewX(-18deg);animation:ray 9s ease-in-out infinite alternate;will-change:transform,opacity}
.rays i.ray:nth-child(1){left:6%}.rays i.ray:nth-child(2){left:40%;width:12%;animation-delay:-3s}.rays i.ray:nth-child(3){left:72%;animation-delay:-6s}
@keyframes ray{from{opacity:.25;transform:skewX(-18deg) translateX(-14px)}to{opacity:.8;transform:skewX(-18deg) translateX(22px)}}
.bub{position:absolute;bottom:-30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);animation:rise linear infinite;pointer-events:none;will-change:transform}
@keyframes rise{to{transform:translate3d(18px,-110vh,0)}}
.waves{position:absolute;left:0;bottom:0;width:100%;height:16%;pointer-events:none;overflow:hidden}
.waves{will-change:transform}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;animation:wv 9s linear infinite;will-change:transform}
.waves svg.b{animation-duration:14s;animation-direction:reverse;bottom:-6px;opacity:.8}
.waves path{transition:fill 1.4s var(--ease-io)}
@keyframes wv{to{transform:translate3d(-50%,0,0)}}

/* ===== PANGGUNG 16:9 (1280x720, diskalakan otomatis) ===== */
#deck{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%}
.deco{position:absolute;left:0;top:0;z-index:1;pointer-events:none;transition:transform 1.5s var(--ease-io);will-change:transform}
.deco .in{width:100%;height:100%;animation:fl 5s ease-in-out infinite alternate;will-change:transform}
.deco svg{width:100%;height:100%;overflow:visible}
@keyframes fl{from{transform:translate3d(0,-6px,0) rotate(-3deg)}to{transform:translate3d(0,8px,0) rotate(3deg)}}
#sun{width:112px;height:112px}#c1{width:156px;height:82px}#c2{width:116px;height:60px}#ball{width:74px;height:74px}#shell{width:64px;height:64px}
#sun .in{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

#slides{position:absolute;inset:0;z-index:2;overflow:visible;perspective:1300px;perspective-origin:50% 42%}
.slide{position:absolute;inset:0;display:none;padding:20px var(--px,48px) 160px;}
.slide.on{display:block;will-change:transform,opacity;transform-style:preserve-3d;transform-origin:50% 50%}
.slide.on .wrap,.slide.on .split,.slide.on .cards,.slide.on .col,.slide.on .cover,.slide.on .cl,.slide.on .members,.slide.on .toc,.slide.on .blist,.slide.on .gcards{transform-style:preserve-3d}
.slide.tr{pointer-events:none}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}

/* judul & teks */
.ttl{display:inline-block;position:relative;background:var(--sun);border:4px solid var(--ink);border-radius:36px 40px 34px 42px/40px 34px 42px 36px;box-shadow:5px 7px 0 var(--ink);padding:10px 40px 12px;font-family:Fredoka,sans-serif;font-weight:700;font-size:56px;line-height:1.12;text-align:center;color:var(--ink);white-space:nowrap;max-width:96%}
.ttl .l{display:inline-block}
.ttl small{display:block;font-size:26px;font-weight:600;opacity:.8;margin-top:2px}
.ttl.big{background:transparent;border:none;box-shadow:none;color:#fff;font-size:118px;line-height:1.02;-webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);letter-spacing:2px;padding:0}
.ttl.big span{display:inline-block;animation:lw 2.8s ease-in-out infinite;animation-delay:calc(var(--i)*.09s);will-change:transform}
@keyframes lw{0%,60%,100%{transform:translate3d(0,0,0) rotate(0)}30%{transform:translate3d(0,-.1em,0) rotate(-3deg)}}
.sub{font-family:Fredoka,sans-serif;font-weight:600;font-size:32px;background:var(--cream);border:3px solid var(--ink);border-radius:28px;padding:8px 28px;box-shadow:4px 4px 0 var(--ink);text-align:center}
.intro{font-weight:700;font-size:28px;text-align:center;color:#fff;text-shadow:0 2px 0 rgba(14,47,79,.55);max-width:1000px;line-height:1.35}

/* kolam */
.pool{contain:layout paint;position:relative;width:100%;aspect-ratio:2/1;border:4px solid var(--ink);border-radius:34px 38px 32px 40px/38px 32px 40px 34px;box-shadow:6px 8px 0 var(--ink);overflow:hidden;background:linear-gradient(180deg,#e9fbff 0%,#bdeeff 42%,#52c6ee 100%)}
.pool svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:12px;left:14px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:4px 16px;font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;z-index:3;box-shadow:2px 3px 0 var(--ink)}

/* kartu */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:20px;width:100%;max-width:1168px;--ic:118px}
.cards.n5{--ic:88px;gap:14px}
.card{position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:28px 32px 26px 34px/32px 26px 34px 28px;box-shadow:5px 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px 12px 18px}
.card .ic{contain:layout paint;width:var(--ic);height:var(--ic);flex:none;background:var(--c,var(--sky));border:3.5px solid var(--ink);border-radius:50%;overflow:hidden;display:grid;place-items:center}
.card .ic svg{width:100%;height:100%;overflow:visible}
.card .ic.sq svg{transform:scale(1.15)}
.card h3{font-family:Fredoka,sans-serif;font-weight:700;font-size:30px;line-height:1.12;margin-bottom:4px}
.card p{font-size:20px;line-height:1.32;font-weight:600;opacity:.92}
.cards.n5 .card h3{font-size:24px}.cards.n5 .card p{font-size:17px;line-height:1.28}
.card .no{position:absolute;top:-14px;right:14px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:14px;font-family:Fredoka,sans-serif;font-weight:700;font-size:18px;padding:1px 12px}
.txtcard{background:var(--cream);border:4px solid var(--ink);border-radius:30px 34px 28px 36px/34px 28px 36px 30px;box-shadow:6px 8px 0 var(--ink);padding:26px 30px;font-size:28px;line-height:1.45;font-weight:700;width:100%}
.txtcard b{background:linear-gradient(transparent 58%,#ffe27a 58%)}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--pink);border:3px solid var(--ink);border-radius:22px;padding:6px 20px;font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;box-shadow:3px 4px 0 var(--ink)}
.chip:nth-child(2){background:var(--mint)}.chip:nth-child(3){background:var(--sun)}
.blist{list-style:none;width:100%;display:flex;flex-direction:column;gap:13px}
.blist li{display:flex;gap:14px;align-items:flex-start;background:var(--cream);border:3px solid var(--ink);border-radius:20px 24px 20px 24px;box-shadow:4px 5px 0 var(--ink);padding:12px 18px;font-size:24px;line-height:1.32;font-weight:700}
.blist li i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;border:3px solid var(--ink);font:700 20px/32px Fredoka,sans-serif;text-align:center;font-style:normal}
.split{display:grid;grid-template-columns:1.12fr 1fr;gap:48px;align-items:center;width:100%;max-width:1168px}
.split .col{display:flex;flex-direction:column;gap:18px;align-items:center}
.col .txtcard{font-size:26px;padding:18px 24px;line-height:1.42}
.col .chips{flex-wrap:wrap;gap:10px;justify-content:center}.col .chip{font-size:18px;padding:5px 14px;white-space:nowrap}

/* kover & penutup */
.cover{display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:36px;width:100%;height:100%}
.cover .cl{display:flex;flex-direction:column;align-items:center;gap:26px}
.go{background:var(--coral);color:#fff;border:4px solid var(--ink);border-radius:32px;padding:12px 48px;font:700 34px Fredoka,sans-serif;box-shadow:5px 6px 0 var(--ink);cursor:pointer}
.go{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.go:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.slide.on .go{animation:gop 1.8s ease-in-out 1.2s infinite}@keyframes gop{50%{scale:1.06}}

/* anggota */
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;width:100%;max-width:900px}
.member{background:var(--cream);border:4px solid var(--ink);border-radius:30px 34px 28px 36px/34px 28px 36px 30px;box-shadow:6px 8px 0 var(--ink);padding:36px 22px;text-align:center;font:700 40px Fredoka,sans-serif;display:flex;align-items:center;justify-content:center;min-height:120px}
.member .no{position:absolute;top:-16px;left:22px;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:16px;font:700 20px Fredoka,sans-serif;padding:3px 16px;box-shadow:2px 3px 0 var(--ink)}
.member{position:relative}

/* daftar isi */
.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;width:100%;max-width:1100px}
.toc .card{cursor:pointer;padding:24px 10px 22px;gap:12px}
.toc .card h3{font-size:26px;margin:0;line-height:1.2}
.toc .num{width:70px;height:70px;border-radius:50%;background:var(--c);border:3.5px solid var(--ink);font:700 34px/63px Fredoka,sans-serif;text-align:center}

/* ringkasan gaya */
.gcards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:100%;max-width:1168px}
.gcard{background:var(--cream);border:4px solid var(--ink);border-radius:28px 32px 26px 34px/32px 26px 34px 28px;box-shadow:5px 7px 0 var(--ink);padding:10px 10px 16px;text-align:center;cursor:pointer}
.gcard .pool{border-width:3px;border-radius:20px;box-shadow:none;margin-bottom:10px}
.gcard h4{font:700 28px Fredoka,sans-serif;margin-bottom:4px}.gcard p{font-size:19px;font-weight:700;opacity:.88;line-height:1.25}
.card,.gcard,.member{transition:translate .4s var(--ease)}.card:hover,.gcard:hover,.member:hover{translate:0 -6px}
.blist li{transition:translate .4s var(--ease)}.blist li:hover{translate:5px 0}
.slide.on .card .ic{animation:icp .9s var(--ease) calc(.75s + var(--n,0)*.08s) backwards}
@keyframes icp{from{transform:scale(.55) rotate(-14deg);opacity:0}}

/* pelatih */
.cch{will-change:transform;position:absolute;bottom:54px;width:128px;height:136px;z-index:5;cursor:pointer}
.cch svg{width:100%;height:100%;overflow:visible}
.cch.R{right:22px}.cch.L{left:22px}
.cch .g-body{animation:cb 1.8s ease-in-out infinite;transform-origin:40px 98px}.cch .g-arm{animation:cw 1.1s ease-in-out infinite;transform-origin:58px 52px}
.cch .g-head{animation:ch 2.4s ease-in-out infinite;transform-origin:40px 44px}
.cch .g-eye{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}
.cch .g-mouth{animation:mo 1.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes cb{50%{transform:scale(1.02,.97)}}@keyframes cw{50%{transform:rotate(-24deg)}}@keyframes ch{50%{transform:rotate(3deg)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}@keyframes mo{50%{transform:scale(1,.55)}}
.say{position:absolute;bottom:100px;max-width:560px;background:#fff;border:3.5px solid var(--ink);border-radius:24px;box-shadow:4px 5px 0 var(--ink);padding:12px 22px;font:700 24px/1.28 Fredoka,sans-serif;z-index:5;pointer-events:none}
.say.R{right:166px}.say.L{left:166px}
.say:after{content:"";position:absolute;top:50%;margin-top:-8px;width:16px;height:16px;background:#fff}
.say.R:after{right:-10px;border-top:3.5px solid var(--ink);border-right:3.5px solid var(--ink);transform:rotate(45deg)}
.say.L:after{left:-10px;border-bottom:3.5px solid var(--ink);border-left:3.5px solid var(--ink);transform:rotate(45deg)}
.slide.on .say{animation:sp .7s .95s var(--ease) backwards}
@keyframes sp{from{transform:translate3d(0,10px,0) scale(.9);opacity:0}}

/* kontrol */
.bar{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:30;display:flex;align-items:center;justify-content:center;gap:18px}
.btn{height:46px;min-width:120px;padding:0 22px;border-radius:24px;border:3px solid var(--ink);background:var(--sun);font:700 20px Fredoka,sans-serif;color:var(--ink);box-shadow:3px 4px 0 var(--ink);cursor:pointer}
.btn{transition:transform .18s var(--ease),box-shadow .18s var(--ease),opacity .3s ease}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.btn[disabled]{opacity:.45}
.btn.nx{background:var(--coral);color:#fff}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid var(--ink);transition:transform .45s var(--ease),background-color .45s ease;cursor:pointer}.dots i.on{background:var(--sun);transform:scale(1.5)}
.cnt{position:absolute;top:14px;left:18px;z-index:30;background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:3px 16px;font:700 18px Fredoka,sans-serif;box-shadow:2px 3px 0 var(--ink)}
.fs{position:absolute;top:12px;right:18px;z-index:30;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--cream);font-size:19px;cursor:pointer;box-shadow:2px 3px 0 var(--ink)}
.hint{position:absolute;right:26px;bottom:18px;z-index:30;color:#fff;font:600 15px Fredoka,sans-serif;opacity:.85;text-shadow:0 1px 0 rgba(14,47,79,.6)}

/* notifikasi putar layar (5 detik) */
#rot{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);opacity:0;transition:transform .6s var(--ease),opacity .45s ease;z-index:99;background:var(--sun);border:3px solid var(--ink);border-radius:22px;box-shadow:3px 4px 0 var(--ink);padding:10px 18px;font:700 15px Fredoka,sans-serif;color:var(--ink);text-align:center;max-width:88vw;pointer-events:none}
#rot.show{transform:translate(-50%,0);opacity:1}
#sa{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (prefers-reduced-motion:reduce){.bub,.rays i.ray,.waves svg{animation:none}}
/* ===== 3D: kedalaman berlapis & gerak ===== */
#decos{position:absolute;inset:0;pointer-events:none;will-change:transform}
#slides{will-change:transform;transform-origin:50% 50%}
.card,.member,.blist li,.gcard,.ttl{transform-style:preserve-3d}
.card .ic{translate:0 0 42px}.card h3{translate:0 0 22px}.card p{translate:0 0 10px}.card .no{translate:0 0 54px}
.toc .num{translate:0 0 34px}
.member .no{translate:0 0 40px}
.blist li i{translate:0 0 30px}.blist li span{translate:0 0 12px}
.gcard .pool{translate:0 0 34px}.gcard h4{translate:0 0 18px}.gcard p{translate:0 0 8px}
.ttl small{translate:0 0 16px}
.say{translate:0 0 46px}
.cch{perspective:460px;transform-style:preserve-3d}
.cch svg{animation:coach3d 3.6s cubic-bezier(.45,0,.55,1) infinite alternate;will-change:rotate}
@keyframes coach3d{from{rotate:0 1 0 -26deg}to{rotate:0 1 0 26deg}}
.card .ic{perspective:240px}
.card .ic svg{animation:ic3d 5.2s cubic-bezier(.45,0,.55,1) infinite alternate;will-change:rotate}
@keyframes ic3d{from{rotate:0 1 0 -24deg}to{rotate:0 1 0 24deg}}
.pool{perspective:820px}
.pool>svg{animation:pool3d 6.5s cubic-bezier(.45,0,.55,1) infinite alternate;scale:1.07;will-change:rotate}
@keyframes pool3d{from{rotate:.25 1 0 -8deg}to{rotate:-.25 1 0 8deg}}
.ttl{animation:ttl3d 6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes ttl3d{from{rotate:1 .4 0 -4deg}to{rotate:1 .4 0 4deg}}
@media (prefers-reduced-motion:reduce){.cch svg,.card .ic svg,.pool>svg,.ttl{animation:none}}

.fs{transition:transform .25s var(--ease)}.fs:active{transform:scale(.92)}
</style></head><body>
<div id="sa"></div><div id="rot">↻ Putar layar ke mode landscape untuk tampilan terbaik</div>
<div class="stage">
<div class="bgl" id="bg1"></div><div class="bgl" id="bg2"></div><div class="rays"><i class="ray"></i><i class="ray"></i><i class="ray"></i></div>
<div class="waves"><svg class="b" viewBox="0 0 2400 120" preserveAspectRatio="none"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" style="fill:var(--w1)"/></svg><svg viewBox="0 0 2400 120" preserveAspectRatio="none" style="opacity:.55"><path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V120 H0Z" style="fill:var(--w2)"/></svg></div>
<div id="deck">
  <div id="decos"></div>
  <div id="slides"></div>
  <div class="cnt"></div><button class="fs" title="Layar penuh (F)">⛶</button><div class="hint">← → ganti slide · F layar penuh</div>
  <div class="bar"><button class="btn" id="prev">◂ Balik</button><div class="dots"></div><button class="btn nx" id="next">Lanjut ▸</button></div>
</div>
</div>
<script>/* =========================================================
   B1 — HELPER SMIL, PERENANG (tampak samping), ORANG (tampak depan), PELATIH
   ========================================================= */
const INK = '#0e2f4f', SKIN = '#e3b08a', SKIN2 = '#c58d68', SUIT = '#1f3b6b', SUIT2 = '#162b50', CAP = '#ff6b5e', TRUNK = '#2b6cb0';
const KS = '.45 0 .55 1';
const spl = n => Array(n - 1).fill(KS).join(';');

/* ===== WARNA, GRADIEN & SHADING (tanpa garis tepi) ===== */
const _hx = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const _mx = (c, t, a) => '#' + _hx(c).map((v, i) => Math.max(0, Math.min(255, Math.round(v + (t[i] - v) * a))).toString(16).padStart(2, '0')).join('');
const lite = (c, a) => _mx(c, [255, 255, 240], a), dark = (c, a) => _mx(c, [28, 22, 58], a);
const GD = {
  lens: '<linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9efff"/><stop offset=".5" stop-color="#4f9ccf"/><stop offset="1" stop-color="#1d4f7a"/></linearGradient>'
};
/* silinder: tepi gelap, sorot di sisi atas */
function lg(c, flip) {
  const id = 'g' + (flip ? 'f' : 'n') + c.slice(1);
  if (!GD[id]) GD[id] = `<linearGradient id="${id}" x1="0" y1="${flip ? 1 : 0}" x2="0" y2="${flip ? 0 : 1}"><stop offset="0" stop-color="${dark(c, .2)}"/><stop offset=".3" stop-color="${lite(c, .24)}"/><stop offset=".62" stop-color="${c}"/><stop offset="1" stop-color="${dark(c, .34)}"/></linearGradient>`;
  return `url(#${id})`;
}
function lgx(c) {
  const id = 'x' + c.slice(1);
  if (!GD[id]) GD[id] = `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${lite(c, .22)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${dark(c, .32)}"/></linearGradient>`;
  return `url(#${id})`;
}
function lv(c) {
  const id = 'v' + c.slice(1);
  if (!GD[id]) GD[id] = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lite(c, .24)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${dark(c, .32)}"/></linearGradient>`;
  return `url(#${id})`;
}
function rg(c) {
  const id = 'r' + c.slice(1);
  if (!GD[id]) GD[id] = `<radialGradient id="${id}" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="${lite(c, .32)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${dark(c, .36)}"/></radialGradient>`;
  return `url(#${id})`;
}

/* ===== INTERPOLASI HALUS (kubik monoton, tanpa patah di tiap keyframe) ===== */
const nsamp = d => Math.max(24, Math.min(200, Math.round(d * 72)));
const _bg = (beg, dur) => ((beg % dur) + dur) % dur;
